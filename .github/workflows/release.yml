name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build system-widget.exe (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-H windowsgui -s -w" -o system-widget.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: system-widget.exe
          generate_release_notes: true
          draft: false
          prerelease: false
