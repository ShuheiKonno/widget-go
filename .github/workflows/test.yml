name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 活動が無い期間に公開された脆弱性も検知する（vuln ジョブ）
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  test:
    # コードは //go:build windows タグ付きのため、ビルド・テストは
    # windows ランナーでないと空回りする（ubuntu では対象ファイルが除外される）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # GPU/NPU 収集 (sysinfo/gpu.go) と collector・HTTP ハンドラの並行アクセスを検査する。
      # race 検出器は cgo 必須なので CGO_ENABLED=1 で実行する (ランナー同梱の MinGW gcc を使用)。
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: go build
        run: go build -ldflags "-H windowsgui" -o system-widget.exe .

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # .golangci.yml (version "2") で高シグナルな linter のみ有効化している。
      # action@v7 は golangci-lint v2 系に対応。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

  # 標準ライブラリと依存モジュールの既知の脆弱性を検査する。
  # go.mod の Go バージョンが古いままだと、修正済みの標準ライブラリの脆弱性が残るので、それも検知できる。
  vuln:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
