name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # コードは //go:build windows タグ付きのため、ビルド・テストは
    # windows ランナーでないと空回りする（ubuntu では対象ファイルが除外される）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -ldflags "-H windowsgui" -o system-widget.exe .

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # .golangci.yml (version "2") で高シグナルな linter のみ有効化している。
      # action@v7 は golangci-lint v2 系に対応。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
