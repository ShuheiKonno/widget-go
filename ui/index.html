<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システムモニター</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0d0d12 0%, #16161e 100%);
            --container-bg: rgba(16,16,22,0.97);
            --text-color: #f0f0f5;
            --muted-color: #a8a8b8;
            --section-bg: rgba(255,255,255,0.05);
            --section-border: rgba(255,255,255,0.10);
            --section-title: #d8d8e8;
            --section-value: #7bffe0;
            --bar-track: rgba(255,255,255,0.12);
            --core-track: rgba(255,255,255,0.10);
            --net-canvas-bg: rgba(0,0,0,0.35);
            --btn-bg: rgba(255,255,255,0.12);
            --btn-bg-hover: rgba(255,255,255,0.22);
            --btn-color: #bbb;
            --input-bg: rgba(255,255,255,0.05);
            --input-border: rgba(255,255,255,0.14);
        }
        body.theme-light {
            --bg-grad: linear-gradient(135deg, #e6e9f5 0%, #cdd6ec 100%);
            --container-bg: rgba(245,246,252,0.96);
            --text-color: #24263a;
            --muted-color: #606078;
            --section-bg: rgba(0,0,0,0.04);
            --section-border: rgba(0,0,0,0.1);
            --section-title: #3b3b5a;
            --section-value: #0a7f68;
            --bar-track: rgba(0,0,0,0.1);
            --core-track: rgba(0,0,0,0.08);
            --net-canvas-bg: rgba(0,0,0,0.06);
            --btn-bg: rgba(0,0,0,0.08);
            --btn-bg-hover: rgba(0,0,0,0.16);
            --btn-color: #444;
            --input-bg: rgba(0,0,0,0.04);
            --input-border: rgba(0,0,0,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; background: var(--bg-grad); color: var(--text-color); font-size: 13px; user-select: none; }
        .container { width: 100%; height: 100%; background: var(--container-bg); padding: 30px 10px 10px 10px; position: relative; cursor: grab; }
        .container.dragging { cursor: grabbing; }
        .top-btns { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 100; }
        .top-btn { width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.2s; }
        .tray-btn { background: var(--btn-bg); color: var(--btn-color); font-size: 14px; line-height: 1; padding: 0 0 5px 0; font-weight: 700; }
        .tray-btn:hover { background: var(--btn-bg-hover); }
        .pin-btn { background: var(--btn-bg); color: var(--btn-color); font-size: 9px; }
        .pin-btn:hover { background: var(--btn-bg-hover); }
        .pin-btn.active { background: #4CAF50; color: #fff; }
        .settings-btn { background: var(--btn-bg); color: var(--btn-color); font-size: 10px; line-height: 1; }
        .settings-btn:hover { background: var(--btn-bg-hover); }
        .compact-btn { background: var(--btn-bg); color: var(--btn-color); font-size: 10px; line-height: 1; }
        .compact-btn:hover { background: var(--btn-bg-hover); }
        /* コンパクト状態時はフル表示に戻す意図が伝わるよう強調色にする */
        .compact-btn.expanded { background: #5aa0ff; color: #fff; font-size: 11px; }
        .compact-btn.expanded:hover { background: #4a90ef; }
        /* コンパクト時は Windows ガジェット相当の幅 (130px) に収めるため、
           フォント・アイコン・余白を一段階小さくする。幅の切替自体は Go 側
           (applyViewModeGeometry) が行う。 */
        .container.compact { padding: 23px 4px 4px 4px; }
        .compact .top-btns { top: 5px; right: 5px; gap: 3px; }
        .compact .top-btn { width: 16px; height: 16px; font-size: 9px; }
        .compact .tray-btn { font-size: 12px; padding: 0 0 4px 0; }
        .compact .compact-btn.expanded { font-size: 10px; }
        .compact .section { padding: 4px 6px; margin-bottom: 3px; }
        .compact .wifi-section { padding: 0; }
        /* wifi-section の中身は flip-face で描画されるので、flip-face 自体も縮める */
        .compact .flip-card > .flip-face { padding: 4px 6px; }
        .compact .section-header { margin-bottom: 0; }
        .compact .section-icon { font-size: 12px; margin-right: 3px; }
        .compact .section-title { font-size: 11px; }
        .compact .section-value { font-size: 11px; }
        .compact .model-name { display: none; }
        .compact .cores-container { display: none; }
        .compact .cpu-progress { display: none; }
        .compact .mem-progress { display: none; }
        .compact .memory-details { display: none; }
        .compact .wifi-info { display: none; }
        .compact .wifi-compact-value { display: inline; }
        .compact .gpu-progress, .compact .npu-progress, .compact .accel-info { display: none; }
        .section { background: var(--section-bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--section-border); }
        .section:last-child, .section.last-visible { margin-bottom: 0; }
        .section-header { display: flex; align-items: center; margin-bottom: 6px; }
        .section-icon { font-size: 14px; margin-right: 6px; }
        /* 幅が足りないときはタイトル側を省略し、右端の数値は必ず出す。
           コンパクト表示 (130px) で「ネットワーク」のような長いタイトルが
           数値を押し出すのを防ぐ。 */
        .section-title { font-size: 12px; font-weight: 600; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--section-title); }
        /* margin-left:auto で、タイトルが伸びない場合でも必ず右端に付ける */
        .section-value { color: var(--section-value); font-size: 13px; font-weight: 700; font-family: 'Consolas', monospace; flex-shrink: 0; margin-left: auto; }
        /* コンパクト時は幅が足りないので短縮ラベル (data-compact) に差し替える。
           textContent は残るのでフル表示の文言と JS の書き換えには影響しない。 */
        .compact .section-title[data-compact] { font-size: 0; }
        .compact .section-title[data-compact]::before { content: attr(data-compact); font-size: 11px; font-weight: 600; }
        /* CPU / GPU / NPU のモデル名。長い名前は省略し、全文は title 属性で出す */
        .model-name { font-size: 10px; line-height: 1.3; color: var(--muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cpu-model { margin-bottom: 2px; }
        .npu-model { margin-top: 4px; }
        .model-name.is-empty { display: none; }
        .progress-bar { position: relative; height: 5px; background: var(--bar-track); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
        .cpu-fill { background: linear-gradient(90deg, #8a9cff, #b07cff); }
        .memory-fill { background: linear-gradient(90deg, #ffa3ff, #ff7a8a); }
        /* CPU クロック行（現在クロック + ベースクロックに対する位置バー） */
        .clock-row { display:flex; align-items:baseline; justify-content:space-between; gap:4px; margin-bottom:4px; }
        .clock-label { color: var(--muted-color); font-size:11px; white-space:nowrap; }
        .clock-value { color: var(--section-value); font-size:12px; font-weight:700; font-family:'Consolas', monospace; white-space:nowrap; }
        .clock-base { color: var(--muted-color); font-size:10px; font-family:'Consolas', monospace; white-space:nowrap; }
        .clock-fill { background: linear-gradient(90deg,#5ad0ff,#8a9cff); }
        /* バーの色は、電源モードの切替機能が使えるとき（ON かつ API が使える）は電源モードで決める:
           省電力 = 緑、バランス = 青（既定）、パフォーマンス = 橙。このときクロックの値では変えない。
           使えないとき（設定で OFF、API が無い環境）は従来どおりクロックで決める:
           ベースクロックを超えた領域（ターボ）は橙で区別する。 */
        .clock-fill.pm-saver { background: linear-gradient(90deg,#7be0a0,#3cc47c); }
        .clock-fill.pm-best, .clock-fill.turbo { background: linear-gradient(90deg,#ffc46a,#ff7a3c); }
        .clock-base-marker { position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,0.55); }
        body.theme-light .clock-base-marker { background:rgba(0,0,0,0.35); }
        /* 電源モード（設定アプリの「電源モード」）。3 段階のスライダー。取得できない環境では hidden。
           コンパクト (130px) には収まらないので隠す。 */
        .power-mode { margin-bottom:6px; --pm-color:#72b6ff; --pm-text:#72b6ff; --pm-fill:0%; }
        /* スライダーの色も電源モードに合わせる（クロックのバーと同じ配色の中間色）:
           省電力 = 緑、バランス = 青、パフォーマンス = 橙。--pm-fill は、つまみの位置までの塗りの幅 */
        .power-mode.pm-saver { --pm-color:#5bd28e; --pm-text:#5bd28e; }
        .power-mode.pm-balanced { --pm-color:#72b6ff; --pm-text:#72b6ff; }
        .power-mode.pm-best { --pm-color:#ff9f53; --pm-text:#ff9f53; }
        /* ライトテーマでは、ラベルの文字だけ濃くして読みやすくする */
        body.theme-light .power-mode.pm-saver { --pm-text:#12905a; }
        body.theme-light .power-mode.pm-balanced { --pm-text:#2f7fd0; }
        body.theme-light .power-mode.pm-best { --pm-text:#d9650f; }
        .power-mode[hidden] { display:none; }
        .pm-slider { -webkit-appearance:none; appearance:none; display:block; width:100%; height:14px; margin:0; background:transparent; cursor:pointer; }
        .pm-slider:focus { outline:none; }
        .pm-slider::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:linear-gradient(to right, var(--pm-color) var(--pm-fill), var(--bar-track) var(--pm-fill)); }
        .pm-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%; background:var(--pm-color); border:2px solid var(--container-bg); box-shadow:0 0 0 1px var(--pm-color); transition:transform 0.15s; }
        .pm-slider:hover:not(:disabled)::-webkit-slider-thumb { transform:scale(1.15); }
        .pm-slider:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--pm-color); }
        /* 電源プランがバランス以外のときは切り替えできない（サーバー側も 409 で拒否する） */
        .pm-slider:disabled { opacity:.4; cursor:default; }
        /* どの段階とも言えないとき（不明な電源モード、バランス以外のプラン）はつまみを隠す */
        .pm-slider.pm-none::-webkit-slider-thumb { opacity:0; box-shadow:none; }
        /* ラベルは両端を寄せ、中央は中央に置く（つまみの位置と合わせる） */
        .pm-labels { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); margin-top:1px; }
        .pm-labels span:first-child { justify-self:start; }
        .pm-labels span:last-child { justify-self:end; }
        /* ウィンドウを狭めたときは、両端のラベルを省略表示にして中央のラベルと重ならないようにする */
        .pm-labels span { max-width:100%; overflow:hidden; text-overflow:ellipsis; font-size:10px; line-height:1.3; white-space:nowrap; color:var(--muted-color); cursor:pointer; }
        .pm-labels span.active { color:var(--pm-text); font-weight:700; }
        .power-mode.locked .pm-labels span { opacity:.4; cursor:default; }
        /* 切替に失敗した直後の合図（理由はツールチップ） */
        .power-mode.err .pm-slider::-webkit-slider-runnable-track { background:#ff6a6a; }
        .compact .power-mode { display:none; }
        .compact .clock-row { display:none; }
        .compact .clock-progress { display:none; }
        .cores-container { display: grid; grid-template-columns: repeat(4,1fr); gap: 3px; margin-top: 5px; }
        .core-item { text-align: center; }
        .core-label { color: var(--muted-color); font-size:8px; display:block; margin-bottom:2px; }
        .core-bar-container { height:24px; background: var(--core-track); border-radius:3px; position:relative; overflow:hidden; }
        .core-bar { position:absolute; bottom:0; width:100%; background:linear-gradient(180deg,#8a9cff,#b07cff); border-radius:3px; transition:height 0.3s ease; }
        .core-value { display:block; text-align:center; color:#fff; font-size:9px; font-weight:600; line-height:24px; height:24px; margin-top:-24px; position:relative; text-shadow:0 1px 2px rgba(0,0,0,0.6); pointer-events:none; }
        body.theme-light .core-value { color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.35); }
        .memory-details { text-align:right; font-size:11px; color: var(--muted-color); font-family:'Consolas', monospace; }
        .memory-details .used { color:#e85ad0; font-weight:600; }
        body:not(.theme-light) .memory-details .used { color:#ffa3ff; }
        .wifi-info { display:flex; flex-direction:column; gap:4px; }
        .wifi-row { display:flex; justify-content:space-between; align-items:center; }
        .wifi-label { color: var(--muted-color); font-size:11px; }
        .wifi-value { color: var(--text-color); font-size:11px; font-weight:600; font-family:'Consolas', monospace; }
        .wifi-connected { color:#1aa86b; }
        body:not(.theme-light) .wifi-connected { color:#7fffaa; }
        .wifi-disconnected { color:#d33; }
        body:not(.theme-light) .wifi-disconnected { color:#ff8a8a; }
        .wifi-compact-value { display:none; }
        /* GPU / NPU。ラベル・値は nowrap にして 1 行に収める（入り切らない分は
           .section-title の省略記号で詰める） */
        .accel-section .section-title, .accel-section .section-value { white-space:nowrap; }
        .gpu-fill { background: linear-gradient(90deg, #6ad7ff, #5a8cff); }
        .npu-fill { background: linear-gradient(90deg, #ffd36a, #ff9f5a); }
        .npu-progress { margin-bottom: 0; } /* NPU はバーで終わるので下余白を詰める */
        .accel-info { display:flex; flex-direction:column; gap:3px; }
        .accel-info .wifi-row { gap:6px; }
        .accel-info .wifi-label, .accel-info .wifi-value { white-space:nowrap; }
        .wifi-section { background:transparent; border:none; padding:0; perspective:800px; }
        .flip-card { display:grid; transform-style:preserve-3d; transition:transform 0.55s; }
        .flip-card > .flip-face { grid-area:1 / 1; backface-visibility:hidden; -webkit-backface-visibility:hidden; background: var(--section-bg); border:1px solid var(--section-border); border-radius:8px; padding:8px 10px; cursor:pointer; }
        /* 表裏は同じセルに重なるので、背面が高いと表面（Wi-Fi の 4 行）が引き伸ばされて下に余白が出る。
           背面を size containment にして高さを表面に任せ、グラフ (canvas) が余った高さを埋める。
           Ethernet のように表面が低いときは min-height で、グラフが潰れない下限を保つ。 */
        .flip-card > .flip-back { transform:rotateY(180deg); display:flex; flex-direction:column; contain:size; min-height:104px; }
        .compact .flip-card > .flip-back { contain:none; min-height:0; }
        .wifi-section.flipped .flip-card { transform:rotateY(180deg); }
        .wifi-section.ethernet-mode .wifi-wireless-only { display:none; }
        .wifi-ethernet-only { display:none; }
        .wifi-section.ethernet-mode .wifi-ethernet-only { display:flex; }
        .net-peak-toggle { cursor:pointer; padding:1px 4px; border-radius:4px; transition:background 0.15s; }
        /* クリック領域を保ったまま、右 4px のパディング分だけ外側へ逃がして
           数値の右端を CPU/メモリ/GPU の行と揃える */
        .compact .net-peak-toggle { margin-right:-4px; }
        .net-peak-toggle:hover { background: var(--btn-bg-hover); }
        .net-canvas { width:100%; flex:1 1 0; min-height:30px; display:block; margin-top:4px; background: var(--net-canvas-bg); border-radius:4px; }
        /* コンパクト時はグラフも rx/tx 数値も非表示にし、CPU/メモリと同じヘッダのみのサイズに揃える */
        .compact .net-canvas { display:none; }
        .net-legend { display:flex; justify-content:space-between; margin-top:4px; font-size:11px; font-family:'Consolas', monospace; }
        .net-leg-rx { color:#1aa86b; }
        body:not(.theme-light) .net-leg-rx { color:#7fffaa; }
        .net-leg-tx { color:#b74da6; }
        body:not(.theme-light) .net-leg-tx { color:#ffa3ff; }
        .compact .net-legend { display:none; }

        /* ===== 区画の折りたたみ（D10）。シェブロンのクリックだけで開閉し、折りたたむと見出しだけが残る ===== */
        .chev { margin-left:4px; width:18px; height:18px; flex:none; border:0; border-radius:50%; background:transparent; color:var(--muted-color); font-size:9px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .2s, background .15s; padding:0; }
        .chev:hover { background: var(--btn-bg-hover); }
        .section.collapsed .section-header { margin-bottom:0; }
        /* 折りたたみ時は見出し 1 行だけなので、上下の余白を詰めて高さを約 3 割抑える */
        .section.collapsed:not(.wifi-section) { padding-top:2.5px; padding-bottom:2.5px; }
        .wifi-section.collapsed .flip-card > .flip-face { padding-top:2.5px; padding-bottom:2.5px; }
        .compact .ai-section.collapsed { padding:0; }
        .section.collapsed .chev { transform:rotate(-90deg); }
        .section.collapsed > .sec-body { display:none; }
        /* Wi-Fi/ネットワークは flip-card の中にあるので、本体を個別に隠し、表面へ戻す。
           表裏の 2 面は同じセルに重なっており、裏面が残ると高さが縮まない。 */
        .wifi-section.collapsed .wifi-info { display:none; }
        /* 折りたたみ中でも、区画のクリックで裏面（トラフィック）へ反転できるようにする。裏面もヘッダ 1 行
           （合計スループット）だけにし、グラフと凡例は隠す。高さは表面と揃うので size containment は外す。 */
        .wifi-section.collapsed .flip-card > .flip-back { contain:none; min-height:0; }
        .wifi-section.collapsed .net-canvas, .wifi-section.collapsed .net-legend { display:none; }
        .wifi-section.collapsed .wifi-compact-value { display:inline; }
        .compact .chev { display:none; }
        .is-hidden { display:none !important; }

        /* ===== AI 使用量（Claude / Codex）===== */
        :root { --claude-a:#f0a27a; --claude-b:#d06b5b; --codex-a:#7be0c0; --codex-b:#34b3d6;
                --warn:#facc15; --crit:#ef6a6a; --ok:#7fffaa; --chip-warn-bg:rgba(250,204,21,.14); --chip-warn-fg:#ffd84d;
                --chip-login-bg:rgba(90,160,255,.16); --chip-login-fg:#9cc6ff; }
        body.theme-light { --claude-a:#e58f63; --claude-b:#c4553f; --codex-a:#2fbf94; --codex-b:#1f8fb3;
                --warn:#d9a400; --crit:#d33; --ok:#1aa86b; --chip-warn-bg:rgba(217,164,0,.16); --chip-warn-fg:#8a6500;
                --chip-login-bg:rgba(30,100,220,.12); --chip-login-fg:#1d5fc2; }
        /* 折りたたみ時: 「C 42% · X 18%」の 1 行サマリでは何の数字か読み取れないので、
           見出しの下にプロバイダごとの「ドット + 名前 + 使用率」を 2 行（Claude / Codex）で出す。
           区画の枠の中なので、行自体の枠・背景は付けない。 */
        .ai-compact { display:none; }
        .ai-section.collapsed .ai-compact { display:flex; flex-direction:column; gap:2px; margin-top:4px; }
        .ai-section.collapsed .ai-crow { background:transparent; border:none; padding:1px 0; }
        /* コンパクト表示: 同じ行を CPU/メモリ/GPU と同じ見た目に揃える。AI 区画のヘッダは
           名前が出れば冗長なので隠し、区画の枠も外して各行を独立した区画として見せる。 */
        .compact .ai-section { background:transparent; border:none; padding:0; }
        .compact .ai-section > .section-header { display:none; }
        .compact .ai-section .sec-body { display:none; }
        .compact .ai-section .ai-compact { display:flex; flex-direction:column; gap:3px; margin-top:0; }
        .compact .ai-section .ai-crow { background:var(--section-bg); border:1px solid var(--section-border); padding:4px 6px; }
        /* 「反転で交互表示」: 2 行を同じセルに重ね、一定間隔で横回転（Wi-Fi 区画と同じ rotateY）して入れ替える。
           行の高さは同じなので、区画の高さは変わらない。 */
        .ai-section.collapsed .ai-compact.rotate, .compact .ai-section .ai-compact.rotate { display:grid; perspective:800px; }
        .ai-section.click-flip.collapsed, .compact .ai-section.click-flip { cursor:pointer; }
        .ai-compact.rotate .ai-crow { grid-area:1 / 1; backface-visibility:hidden; -webkit-backface-visibility:hidden; transition:transform .55s; }
        .ai-compact.rotate .ai-crow:nth-child(2) { transform:rotateY(180deg); }
        .ai-compact.rotate.flip .ai-crow:nth-child(1) { transform:rotateY(180deg); }
        .ai-compact.rotate.flip .ai-crow:nth-child(2) { transform:rotateY(0); }
        /* 折りたたみ + 反転表示: 見出しとは別の行を作らず、見出しの 1 行の中（名称とシェブロンの間）に
           交互表示の行を置く。見出しを display:contents にして、アイコン・名称・行・シェブロンを同じ行に並べる。
           コンパクト表示は見出しを隠して行だけを出すので対象外。 */
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot { display:flex; align-items:center; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot > .section-header { display:contents; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .section-title { white-space:nowrap; flex:none; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-refresh { display:none; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .chev { order:3; }
        /* 折りたたみ + 反転表示は、Wi-Fi 区画と同じく「枠ごと」回す。行だけを回すと枠（背景・ボーダー）が
           止まったままになるので、区画そのものを 90° まで回し（ai-flip-out）、真横を向いた瞬間に
           Claude / Codex を差し替え（ai-flip-snap で -90° に置く）、0° まで回し戻す（ai-flip-in）。
           行は重ねず、.flip でどちらか一方だけを出す（回転は区画側が担う）。 */
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot { transform:perspective(800px) rotateY(0deg); }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot.ai-flip-out { transform:perspective(800px) rotateY(90deg); transition:transform .275s ease-in; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot.ai-flip-snap { transform:perspective(800px) rotateY(-90deg); transition:none; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot.ai-flip-in { transform:perspective(800px) rotateY(0deg); transition:transform .275s ease-out; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-compact.rotate { display:flex; perspective:none; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-compact.rotate .ai-crow { transform:none; transition:none; backface-visibility:visible; -webkit-backface-visibility:visible; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-compact.rotate .ai-crow:nth-child(2),
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-compact.rotate.flip .ai-crow:nth-child(1) { display:none; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-compact.rotate.flip .ai-crow:nth-child(2) { display:flex; }
        #dragArea:not(.compact) .ai-section.collapsed.ai-rot .ai-compact { order:2; flex:1 1 0; min-width:0; margin:0 0 0 8px; }
        .ai-crow { display:flex; align-items:center; background:var(--section-bg); border:1px solid var(--section-border); border-radius:8px; padding:4px 6px; }
        .ai-crow i { width:8px; height:8px; border-radius:50%; flex:none; margin-right:6px; }
        .ai-crow.claude i { background:linear-gradient(135deg,var(--claude-a),var(--claude-b)); }
        .ai-crow.codex i { background:linear-gradient(135deg,var(--codex-a),var(--codex-b)); }
        .ai-cname { font-size:11px; font-weight:600; color:var(--section-title); flex-grow:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .ai-cval { font-size:11px; font-weight:700; font-family:'Consolas', monospace; color:var(--section-value); flex-shrink:0; margin-left:auto; }
        .ai-cval.warn { color:var(--warn); }
        .ai-cval.crit { color:var(--crit); }
        .ai-cval.na { color:var(--muted-color); }
        .ai-refresh { margin-left:4px; width:18px; height:18px; flex:none; border:0; border-radius:50%; background:transparent; color:var(--muted-color); font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
        .ai-refresh:hover { background: var(--btn-bg-hover); }
        .ai-refresh.busy { animation: ai-spin 0.9s linear infinite; pointer-events:none; }
        @keyframes ai-spin { to { transform: rotate(360deg); } }
        .compact .ai-refresh { display:none; }
        .pct.warn { color:var(--warn); } .pct.crit { color:var(--crit); }
        .pct.na { color:var(--muted-color); }
        .prov + .prov { margin-top:9px; padding-top:8px; border-top:1px dashed var(--section-border); }
        .prov-head { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
        .prov-name { font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; cursor:pointer; }
        .prov-name i { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .claude .prov-name i { background:linear-gradient(135deg,var(--claude-a),var(--claude-b)); }
        .codex .prov-name i { background:linear-gradient(135deg,var(--codex-a),var(--codex-b)); }
        .plan { font-size:9px; padding:0 5px; border-radius:8px; border:1px solid var(--section-border); color:var(--muted-color); line-height:15px; white-space:nowrap; }
        .prov-state { margin-left:auto; font-size:10px; color:var(--muted-color); cursor:pointer; white-space:nowrap; }
        .prov-state.ok::before { content:'● '; color:var(--ok); }
        .prov-state.inc::before { content:'▲ '; color:var(--warn); }
        .wrow { display:grid; grid-template-columns:20px 1fr 34px; align-items:center; column-gap:6px; }
        .wrow .lab { font-size:11px; color:var(--muted-color); }
        .wrow .progress-bar { margin:0; height:6px; }
        .wrow .pct { text-align:right; font-family:'Consolas', monospace; font-size:12px; font-weight:700; }
        .wreset { font-size:10px; color:var(--muted-color); padding-left:26px; margin:1px 0 4px; font-family:'Consolas', monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .claude .progress-fill { background:linear-gradient(90deg,var(--claude-a),var(--claude-b)); }
        .codex .progress-fill { background:linear-gradient(90deg,var(--codex-a),var(--codex-b)); }
        .progress-fill.warn { background:var(--warn) !important; }
        .progress-fill.crit { background:var(--crit) !important; }
        .extra { font-size:10px; color:var(--muted-color); padding-left:26px; display:flex; justify-content:space-between; font-family:'Consolas', monospace; margin-bottom:2px; gap:6px; }
        .chip { display:flex; align-items:center; gap:6px; font-size:10px; line-height:1.3; padding:4px 6px; border-radius:5px; margin-bottom:5px; overflow-wrap:anywhere; }
        .chip.warn { background:var(--chip-warn-bg); color:var(--chip-warn-fg); cursor:pointer; }
        .chip.login { background:var(--chip-login-bg); color:var(--chip-login-fg); }
        .chip.info { background:var(--section-bg); color:var(--muted-color); }
        .ai-act { margin-left:auto; border:0; border-radius:4px; background:#5aa0ff; color:#fff; font:inherit; font-size:10px; padding:2px 8px; cursor:pointer; flex:none; }
        .ai-act:hover { background:#4a90ef; }
        .ai-act.quiet { background: var(--btn-bg); color: var(--text-color); }
        .ai-act.quiet:hover { background: var(--btn-bg-hover); }

    </style>
</head>
<body>
    <div class="container" id="dragArea">
        <div class="top-btns">
            <button class="top-btn pin-btn" id="pinBtn" title="常に前面に表示">📌</button>
            <button class="top-btn settings-btn" id="settingsBtn" title="表示オプション">⚙</button>
            <button class="top-btn compact-btn" id="compactBtn" title="コンパクト表示">▬</button>
            <button class="top-btn tray-btn" id="closeBtn" title="タスクバーに格納">_</button>
        </div>
        <div class="section" data-sec="cpu">
            <div class="section-header"><span class="section-icon">💻</span><span class="section-title">CPU</span><span class="section-value" id="cpu-overall">0%</span><button class="chev" data-sec="cpu" title="折りたたむ">▼</button></div>
            <div class="sec-body">
                <div class="progress-bar cpu-progress"><div class="progress-fill cpu-fill" id="cpu-bar" style="width:0%"></div></div>
                <div class="clock-row"><span class="clock-label">クロック</span><span class="clock-value" id="cpu-clock">--- GHz</span><span class="clock-base" id="cpu-clock-base">base ---</span></div>
                <div class="progress-bar clock-progress"><div class="progress-fill clock-fill" id="clock-bar" style="width:0%"></div><div class="clock-base-marker" id="clock-base-marker" style="left:50%"></div></div>
                <div class="power-mode" id="powerMode" hidden>
                    <input type="range" class="pm-slider" id="pmSlider" min="0" max="2" step="1" value="1" aria-label="電源モード">
                    <div class="pm-labels">
                        <span data-mode="saver" title="最適な電力効率">省電力</span>
                        <span data-mode="balanced" title="バランス">バランス</span>
                        <span data-mode="best" title="最適なパフォーマンス">パフォーマンス</span>
                    </div>
                </div>
                <div class="model-name cpu-model is-empty" id="cpu-model"></div>
                <div class="cores-container" id="cores-container"></div>
            </div>
        </div>
        <div class="section" data-sec="memory">
            <div class="section-header"><span class="section-icon">🧠</span><span class="section-title">メモリ</span><span class="section-value" id="memory-percent">0%</span><button class="chev" data-sec="memory" title="折りたたむ">▼</button></div>
            <div class="sec-body">
                <div class="progress-bar mem-progress"><div class="progress-fill memory-fill" id="memory-bar" style="width:0%"></div></div>
                <div class="memory-details"><span class="used" id="memory-used">0 GB</span><span id="memory-total">/ 0 GB</span></div>
            </div>
        </div>
        <!-- GPU/NPU は wifi の前に置く（後ろに置くと非表示でも .section:last-child を奪い、下に余白が残る） -->
        <div class="section accel-section" id="gpuSection" data-sec="gpu" style="display:none">
            <div class="section-header"><span class="section-icon">🎮</span><span class="section-title">GPU</span><span class="section-value" id="gpu-total">---</span><button class="chev" data-sec="gpu" title="折りたたむ">▼</button></div>
            <div class="sec-body">
                <div class="progress-bar gpu-progress"><div class="progress-fill gpu-fill" id="gpu-bar" style="width:0%"></div></div>
                <div class="accel-info">
                    <div class="model-name is-empty" id="gpu-model"></div>
                    <div class="wifi-row"><span class="wifi-label">専用メモリ</span><span class="wifi-value" id="gpu-dedicated">---</span></div>
                    <div class="wifi-row"><span class="wifi-label">共有メモリ</span><span class="wifi-value" id="gpu-shared">---</span></div>
                </div>
            </div>
        </div>
        <div class="section accel-section" id="npuSection" data-sec="npu" style="display:none">
            <div class="section-header"><span class="section-icon">🧩</span><span class="section-title">NPU</span><span class="section-value" id="npu-usage">---</span><button class="chev" data-sec="npu" title="折りたたむ">▼</button></div>
            <div class="sec-body">
                <div class="progress-bar npu-progress"><div class="progress-fill npu-fill" id="npu-bar" style="width:0%"></div></div>
                <div class="model-name npu-model is-empty" id="npu-model"></div>
            </div>
        </div>
        <div class="section wifi-section" id="wifiSection" data-sec="network">
            <div class="flip-card">
                <div class="flip-face flip-front">
                    <div class="section-header"><span class="section-icon" id="conn-icon">📶</span><span class="section-title" id="conn-title">Wi-Fi</span><span class="section-value wifi-compact-value" id="wifi-compact">---</span><button class="chev" data-sec="network" title="折りたたむ">▼</button></div>
                    <div class="wifi-info">
                        <div class="wifi-row wifi-detail"><span class="wifi-label" id="wifi-ssid-label">SSID</span><span class="wifi-value" id="wifi-ssid">---</span></div>
                        <div class="wifi-row wifi-wireless-only"><span class="wifi-label">帯域</span><span class="wifi-value" id="wifi-band">---</span></div>
                        <div class="wifi-row wifi-detail wifi-wireless-only"><span class="wifi-label">規格</span><span class="wifi-value" id="wifi-type">---</span></div>
                        <div class="wifi-row wifi-detail wifi-wireless-only"><span class="wifi-label">信号強度</span><span class="wifi-value" id="wifi-signal">---</span></div>
                        <div class="wifi-row wifi-ethernet-only"><span class="wifi-label">速度</span><span class="wifi-value" id="eth-speed">---</span></div>
                    </div>
                </div>
                <div class="flip-face flip-back">
                    <div class="section-header"><span class="section-icon">📊</span><span class="section-title" data-compact="Net">Network</span><span class="section-value net-peak-toggle" id="net-peak" title="クリックで単位切替 (B ⇔ bit)">---</span><button class="chev" data-sec="network" title="折りたたむ">▼</button></div>
                    <canvas class="net-canvas" id="netCanvas"></canvas>
                    <div class="net-legend">
                        <span class="net-leg-rx">↓ <span id="net-rx-val">0 B/s</span></span>
                        <span class="net-leg-tx">↑ <span id="net-tx-val">0 B/s</span></span>

            </div>
        </div>
        <!-- AI 使用量（Claude / Codex）。既定は OFF なので非表示。既存の区画の下に置く（D8） -->
        <div class="section ai-section is-hidden" id="aiSection" data-sec="ai">
            <div class="section-header"><span class="section-icon">🤖</span><span class="section-title">AI 使用量</span><button class="ai-refresh" id="aiRefreshBtn" type="button" title="今すぐ更新">↻</button><button class="chev" data-sec="ai" title="折りたたむ">▼</button></div>
            <div class="ai-compact" id="ai-compact"></div>
            <div class="sec-body" id="ai-body"></div>
        </div>
    </div>
    <script nonce="__WIDGET_TOKEN__">
        // 全 /api 呼び出しに付与する CSRF トークン（Go 側が起動毎に生成し埋め込む）。
        const WIDGET_TOKEN = '__WIDGET_TOKEN__';
        // fetch のラッパー。X-Widget-Token カスタムヘッダを必ず付与する。
        // サーバー側 securityMiddleware がこのヘッダを検証し、外部ページからの
        // CSRF リクエスト（カスタムヘッダを付けられない単純リクエスト）を弾く。
        function apiFetch(url, opts){
            opts = opts || {};
            opts.headers = Object.assign({}, opts.headers, { 'X-Widget-Token': WIDGET_TOKEN });
            return fetch(url, opts);
        }
        const wifiStandards = { '802.11a':'802.11a','802.11b':'802.11b','802.11g':'802.11g','802.11n':'802.11n (Wi-Fi 4)','802.11ac':'802.11ac (Wi-Fi 5)','802.11ax':'802.11ax (Wi-Fi 6)','802.11be':'802.11be (Wi-Fi 7)' };
        function formatBytes(b){return (b/(1024*1024*1024)).toFixed(1)+' GB';}
        // Ethernet 標準速度 (10/100/1000/2500/5000/10000 Mbps) から ±2% 以内ならスナップ。
        // ドライバが 1Gbps リンクを 995Mbps と報告するようなケースへの対策。
        function snapEthernetLinkSpeedMbps(mbps){
            const standards = [10, 100, 1000, 2500, 5000, 10000];
            for (const s of standards){
                if (Math.abs(mbps - s) / s <= 0.02) return s;
            }
            return mbps;
        }
        function formatLinkSpeed(bps){
            if(!bps || bps <= 0) return '---';
            const mbps = snapEthernetLinkSpeedMbps(bps / 1000000);
            if (mbps >= 1000){
                const gbps = mbps / 1000;
                return (gbps % 1 === 0 ? gbps.toFixed(0) : gbps.toFixed(1)) + ' Gbps';
            }
            return Math.round(mbps) + ' Mbps';
        }

        // CPU クロック表示。
        // 現在クロックは PDH の "% Processor Performance" × ベースクロックで算出された値
        // （タスクマネージャーの「速度」と同じ）。ターボ時はベースを超える。
        // バーのスケール上限は「ベース×2」を基準にし、観測した最大がそれを超えた場合のみ追随する。
        let clockObservedMaxMHz = 0;
        function formatClock(mhz){
            if(!mhz || mhz <= 0) return '--- GHz';
            if(mhz >= 1000) return (mhz/1000).toFixed(2) + ' GHz';
            return Math.round(mhz) + ' MHz';
        }
        function updateClock(f){
            const valueEl = document.getElementById('cpu-clock');
            const baseEl = document.getElementById('cpu-clock-base');
            const bar = document.getElementById('clock-bar');
            const marker = document.getElementById('clock-base-marker');
            if(!f || !f.BaseMHz){
                valueEl.textContent = '--- GHz';
                baseEl.textContent = 'base ---';
                bar.style.width = '0%';
                return;
            }
            const cur = f.CurrentMHz || 0;
            const base = f.BaseMHz;
            valueEl.textContent = formatClock(cur);
            // 幅を節約するため base 表記だけ数値と単位を詰める
            baseEl.textContent = 'base ' + formatClock(base).replace(' ', '');
            if(cur > clockObservedMaxMHz) clockObservedMaxMHz = cur;
            const scaleMax = Math.max(base * 2, clockObservedMaxMHz * 1.05);
            bar.style.width = Math.min(100, cur / scaleMax * 100).toFixed(1) + '%';
            marker.style.left = (base / scaleMax * 100).toFixed(1) + '%';
            // 電源モードが取れているとき（lastPowerMode あり）は、色は電源モードで決まる（setClockColor）。
            // 取れていない（切替機能が OFF、API が使えない）ときだけ、ベース超え（ターボ動作中）を橙で示す。
            // トレイの帯（tray.go の trayAccentColor）も同じ規則で、しきい値を合わせること。
            bar.classList.toggle('turbo', !lastPowerMode && cur > base * 1.02);
        }

        // ============ 電源モード（設定アプリの「電源モード」）============
        // 状態は /api/system の PowerMode（{planOK, active}、取得できない環境では null）。
        // OS の状態なので config.json には保存しない。設定アプリでの変更も 2 秒周期の更新で追従する。
        // 電源プランがバランス以外のときは、効かないので 3 ボタンとも無効にする（サーバー側も 409 で拒否する）。
        // 3 段階のスライダー。つまみの位置 0 / 1 / 2 が POWER_MODES の添字に対応する。
        // ドラッグ中は表示（ラベルの強調）だけを追従させ、指を離したとき（change）に切り替える。
        const POWER_MODES = ['saver', 'balanced', 'best'];
        const powerModeNames = { saver: '最適な電力効率', balanced: 'バランス', best: '最適なパフォーマンス' };
        const powerPlanLockedTip = '電源プランが「バランス」以外のため切り替えできません';
        const powerRow = document.getElementById('powerMode');
        const powerSlider = document.getElementById('pmSlider');
        let lastPowerMode = null;   // 直近にサーバーから得た状態（失敗時にここへ戻す）
        let powerModeShown = false;
        let powerModeBusy = false;  // 切替要求の処理中。二重操作と、途中の更新による表示の巻き戻りを防ぐ
        let powerModeDragging = false;  // つまみの操作中。2 秒周期の更新でつまみが戻るのを防ぐ
        let powerModeError = '';
        let powerModeErrTimer = 0;
        // 段階 mode（saver / balanced / best。それ以外は「どれでもない」）に合わせて、ラベルの強調と、
        // スライダーの色（.power-mode.pm-*）・塗りの幅を決める。ドラッグ中の途中経過の表示にも使う。
        function markPowerMode(mode){
            powerRow.querySelectorAll('.pm-labels span').forEach(function(l){
                l.classList.toggle('active', l.dataset.mode === mode);
            });
            POWER_MODES.forEach(function(m){ powerRow.classList.toggle('pm-' + m, m === mode); });
            const i = POWER_MODES.indexOf(mode);
            powerRow.style.setProperty('--pm-fill', i < 0 ? '0%' : (i * 50) + '%');
        }
        // クロックのバーの色を電源モードに合わせる（CSS の .clock-fill.pm-*）。
        // 電源プランがバランス以外・不明な電源モード・取得不可のときは既定の色（青）に戻す。
        const clockBar = document.getElementById('clock-bar');
        function setClockColor(mode){
            clockBar.classList.toggle('pm-saver', mode === 'saver');
            clockBar.classList.toggle('pm-best', mode === 'best');
        }
        function renderPowerMode(pm){
            setClockColor(pm && pm.planOK ? pm.active : '');
            // 電源モードが取れているときはターボ色を使わない（切替機能を ON にした直後に、次の更新まで重ならないように）
            if (pm) clockBar.classList.remove('turbo');
            const show = !!pm;
            if (show !== powerModeShown) {
                powerModeShown = show;
                powerRow.hidden = !show;
                scheduleHeightAdjust();   // 行の出入りで区画の高さが変わる
            }
            if (!pm) return;
            const idx = POWER_MODES.indexOf(pm.active);
            const known = pm.planOK && idx >= 0;
            powerSlider.disabled = !pm.planOK;
            powerSlider.value = idx >= 0 ? idx : 1;
            powerSlider.classList.toggle('pm-none', !known);
            powerRow.classList.toggle('locked', !pm.planOK);
            markPowerMode(known ? pm.active : '');
            let tip = '電源モード: ' + (known ? powerModeNames[pm.active] : '不明');
            if (!pm.planOK) tip = powerPlanLockedTip;
            else if (pm.active === 'other') tip = '電源モード: 不明な電源モードです（どれかを選ぶと切り替わります）';
            if (powerModeError) tip = powerModeError;
            powerSlider.title = tip;
        }
        function updatePowerMode(pm){
            lastPowerMode = pm || null;
            if (!powerModeBusy && !powerModeDragging) renderPowerMode(lastPowerMode);
        }
        function showPowerModeError(msg){
            powerModeError = '切り替えに失敗しました: ' + msg;
            powerRow.classList.add('err');
            clearTimeout(powerModeErrTimer);
            powerModeErrTimer = setTimeout(function(){
                powerModeError = '';
                powerRow.classList.remove('err');
                renderPowerMode(lastPowerMode);
            }, 4000);
        }
        // 指を離した / キーで確定した / クリックしたときに切り替える。
        async function commitPowerMode(mode){
            if (powerModeBusy || !lastPowerMode || !lastPowerMode.planOK) { renderPowerMode(lastPowerMode); return; }
            const prev = lastPowerMode;
            if (prev.active === mode) { renderPowerMode(prev); return; }
            powerModeBusy = true;
            // 操作の結果を先に見せる。失敗したら実際の状態へ戻す。
            renderPowerMode(Object.assign({}, prev, { active: mode }));
            try {
                const res = await apiFetch('/api/powermode?mode=' + encodeURIComponent(mode));
                if (!res.ok) throw new Error((await res.text()).trim() || ('HTTP ' + res.status));
                lastPowerMode = await res.json();
            } catch (err) {
                showPowerModeError(err && err.message ? err.message : String(err));
            } finally {
                powerModeBusy = false;
                renderPowerMode(lastPowerMode);
            }
        }
        // ドラッグ中はラベルの強調だけ追従させる（切り替えは change で行う）
        powerSlider.addEventListener('input', function(){ markPowerMode(POWER_MODES[Number(powerSlider.value)]); });
        powerSlider.addEventListener('change', function(){
            powerModeDragging = false;
            commitPowerMode(POWER_MODES[Number(powerSlider.value)]);
        });
        powerSlider.addEventListener('pointerdown', function(){ powerModeDragging = true; });
        // 同じ位置で離したときは change が来ないので、操作中の印を外す（change は同じイベント処理内で先に走る）
        ['pointerup', 'pointercancel'].forEach(function(t){
            powerSlider.addEventListener(t, function(){ setTimeout(function(){ powerModeDragging = false; if (!powerModeBusy) renderPowerMode(lastPowerMode); }, 0); });
        });
        powerSlider.addEventListener('blur', function(){ powerModeDragging = false; });
        // ラベルのクリックでもその段階へ切り替える
        powerRow.querySelectorAll('.pm-labels span').forEach(function(l){
            l.addEventListener('click', function(e){
                e.stopPropagation();
                if (powerSlider.disabled) return;
                commitPowerMode(l.dataset.mode);
            });
        });

        // 設定は Go 側の config.json に永続化される。フロント側は API 経由で読み書きする。
        // ここで保持する settings オブジェクトは UI 反映のためのキャッシュ。
        const settings = {
            theme: 'system',
            transparent: false,
            // 電源モードの切替機能の ON/OFF（Go 側の config.json の powerModeEnabled。既定 OFF）
            powerMode: false,
            coreBase: 0,
            trayDisplay: 'icon',
            topmost: false,
            viewMode: 0,
            netUnit: 'byte',
            // 非表示状態（Go 側の config.json の hidden と同じ）。true が非表示
            hidden: { cpu: false, memory: false, gpu: false, npu: false, network: false },
            // 区画の表示順（Go 側の config.json の order と同じ）
            order: ['cpu', 'memory', 'gpu', 'npu', 'network', 'ai'],
            // 折りたたみ状態（Go 側の config.json の collapsed と同じ）。AI は既定で折りたたみ（D8）
            collapsed: { cpu: false, memory: false, gpu: false, npu: false, network: false, ai: true }
        };

        // Close button (✕): タスクトレイに格納する
        document.getElementById('closeBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            // トレイ格納前に現在の位置・サイズを保存
            apiFetch('/api/persistwindow').finally(() => apiFetch('/api/entertray').catch(()=>{}));
        });

        // Pin button (always-on-top)
        document.getElementById('pinBtn').addEventListener('click', async function(e) {
            e.stopPropagation();
            try {
                const res = await apiFetch('/api/toggletopmost');
                const data = await res.json();
                this.classList.toggle('active', data.topmost);
                settings.topmost = !!data.topmost;
            } catch(err) {}
        });

        // Normal ⇔ Compact のトグル
        let currentViewMode = 0;
        function applyCompactBtn(){
            const btn = document.getElementById('compactBtn');
            if (currentViewMode === 1) {
                btn.textContent = '▢';
                btn.title = 'フル表示';
                btn.classList.add('expanded');
            } else {
                btn.textContent = '▬';
                btn.title = 'コンパクト表示';
                btn.classList.remove('expanded');
            }
        }
        document.getElementById('compactBtn').addEventListener('click', async function(e) {
            e.stopPropagation();
            if (currentViewMode === 0) {
                currentViewMode = 1;
                document.getElementById('dragArea').classList.add('compact');
            } else if (currentViewMode === 1) {
                currentViewMode = 0;
                document.getElementById('dragArea').classList.remove('compact');
            } else {
                return;
            }
            settings.viewMode = currentViewMode;
            applyCompactBtn();
            updateNetValue();
            // 幅と位置の切替は Go 側 (applyViewModeGeometry) が行う。幅が変わるとセクションの
            // 折り返しが変わるので、完了を待ってから自然高さを測り直す。
            await apiFetch('/api/setviewmode?mode=' + currentViewMode).catch(()=>{});
            setTimeout(adjustWindowHeight, 60);
            // 高さ確定後にウィンドウ位置・サイズを config に永続化
            setTimeout(() => apiFetch('/api/persistwindow').catch(()=>{}), 300);
        });

        // ネットワーク部 peak 表示: クリックで B/s ⇔ bps トグル
        // wifi-section のクリック(フリップ)より先に捕まえる必要があるので stopPropagation
        document.getElementById('net-peak').addEventListener('click', function(e){
            e.stopPropagation();
            netUnit = (netUnit === 'byte') ? 'bit' : 'byte';
            settings.netUnit = netUnit;
            apiFetch('/api/setoption?key=netUnit&value=' + netUnit).catch(()=>{});
            refreshNetLegend();
            updateNetValue();
            drawNetGraph();
        });

        // Wi-Fi ⇔ ネットワークグラフ の反転トグル
        // ドラッグとクリックを区別するため、mousedown からの移動量で判定する
        let mouseDownX = 0, mouseDownY = 0, movedSinceDown = false;
        const wifiSection = document.getElementById('wifiSection');
        wifiSection.addEventListener('click', function(e) {
            if (movedSinceDown) return;
            e.stopPropagation();
            wifiSection.classList.toggle('flipped');
            if (wifiSection.classList.contains('flipped')) {
                // フリップ直後はキャンバスの clientWidth が 0 のことがあるので
                // アニメーション完了後も含めて二度描画しておく
                setTimeout(drawNetGraph, 30);
                setTimeout(drawNetGraph, 600);
            }
        });

        // Drag functionality
        let isDragging = false;
        let isResizing = false;
        let dragReady = false;    // /api/dragstart 完了までは dragmove を送らない
        let resizeReady = false;  // 初期サイズ取得までは resize を送らない
        let resizeDir = '';
        let startCursorX, startCursorY;
        let startWinW = 0, startWinH = 0;
        const dragArea = document.getElementById('dragArea');
        const resizeMargin = 6;

        // mousemove ごとに無制限に fetch するとリクエストが詰まってウィンドウがガタつく。
        // 常に「最新の1件だけ」を in-flight にし、待機中の更新は末尾で1回だけ送る（coalescing）。
        let dragReqInFlight = false, dragPending = false;
        function sendDragMove(){
            if (dragReqInFlight){ dragPending = true; return; }
            dragReqInFlight = true;
            apiFetch('/api/dragmove').catch(()=>{}).finally(()=>{
                dragReqInFlight = false;
                if (dragPending){ dragPending = false; sendDragMove(); }
            });
        }
        let resizeReqInFlight = false, resizePending = null;
        function sendResize(w, h, anchorTop){
            resizePending = { w: w, h: h, anchorTop: anchorTop };
            if (resizeReqInFlight) return;
            resizeReqInFlight = true;
            (function fire(){
                const p = resizePending; resizePending = null;
                let url = '/api/resize?w=' + Math.round(p.w) + '&h=' + Math.round(p.h);
                if (p.anchorTop) url += '&anchor=top';
                apiFetch(url).catch(()=>{}).finally(()=>{
                    if (resizePending){ fire(); } else { resizeReqInFlight = false; }
                });
            })();
        }

        dragArea.addEventListener('mousemove', function(e) {
            if (isDragging || isResizing) return;
            const rect = dragArea.getBoundingClientRect();
            const onRight = (rect.right - e.clientX) <= resizeMargin;
            const onBottom = (rect.bottom - e.clientY) <= resizeMargin;
            if (onRight && onBottom) {
                dragArea.style.cursor = 'nwse-resize';
            } else if (onRight) {
                dragArea.style.cursor = 'ew-resize';
            } else if (onBottom) {
                dragArea.style.cursor = 'ns-resize';
            } else {
                dragArea.style.cursor = 'grab';
            }
        });

        dragArea.addEventListener('mouseleave', function() {
            if (!isDragging && !isResizing) {
                dragArea.style.cursor = 'grab';
            }
        });

        dragArea.addEventListener('mousedown', async function(e) {
            mouseDownX = e.screenX;
            mouseDownY = e.screenY;
            movedSinceDown = false;
            if (e.target.id === 'closeBtn' || e.target.closest('.chev, .ai-act, .ai-refresh, .power-mode')) return;
            const rect = dragArea.getBoundingClientRect();
            const onRight = (rect.right - e.clientX) <= resizeMargin;
            const onBottom = (rect.bottom - e.clientY) <= resizeMargin;
            if (onRight || onBottom) {
                isResizing = true;
                resizeReady = false;
                resizeDir = (onRight ? 'r' : '') + (onBottom ? 'b' : '');
                dragArea.classList.add('resizing');
                startCursorX = e.screenX;
                startCursorY = e.screenY;
                try {
                    const res = await apiFetch('/api/windowsize');
                    const data = await res.json();
                    startWinW = data.width;
                    startWinH = data.height;
                    resizeReady = true;  // 初期サイズ確定後のみ resize を送る
                } catch(err) {
                    isResizing = false;
                    dragArea.classList.remove('resizing');
                }
                e.preventDefault();
                return;
            }
            isDragging = true;
            dragReady = false;
            dragArea.classList.add('dragging');
            // dragstart で基準座標を記録し終えるまで dragmove を送らない
            // (未 await のまま dragmove が走ると誤った基準でウィンドウが飛ぶ)
            apiFetch('/api/dragstart')
                .then(()=>{ dragReady = true; })
                .catch(()=>{ isDragging = false; dragArea.classList.remove('dragging'); });
        });

        document.addEventListener('mousemove', function(e) {
            if (!movedSinceDown) {
                const dx = Math.abs(e.screenX - mouseDownX);
                const dy = Math.abs(e.screenY - mouseDownY);
                if (dx > 3 || dy > 3) movedSinceDown = true;
            }
            if (isResizing) {
                if (!resizeReady) return;
                const dx = e.screenX - startCursorX;
                const dy = e.screenY - startCursorY;
                let newW = startWinW;
                let newH = startWinH;
                if (resizeDir.indexOf('r') !== -1) {
                    newW = startWinW + dx;
                }
                if (resizeDir.indexOf('b') !== -1) {
                    newH = startWinH + dy;
                }
                // 下端を掴んだリサイズは上端を固定して下方向に伸ばす
                // (anchor=top)。掴んだエッジとカーソルが乖離しないようにする。
                sendResize(newW, newH, resizeDir.indexOf('b') !== -1);
                return;
            }
            if (!isDragging || !dragReady) return;
            sendDragMove();
        });

        document.addEventListener('mouseup', function() {
            const wasDragging = isDragging;
            const wasResizing = isResizing;
            if (isResizing) {
                isResizing = false;
                dragArea.classList.remove('resizing');
            }
            isDragging = false;
            dragArea.classList.remove('dragging');
            if (wasDragging || wasResizing) {
                apiFetch('/api/persistwindow').catch(()=>{});
            }
        });

        function adjustWindowHeight() {
            // height:100% / overflow:hidden の影響を避けるため
            // 一時的に auto にしてコンテンツの自然な高さを測定する
            updateLastSection();
            const el = document.documentElement;
            const bd = document.body;
            const ct = document.getElementById('dragArea');
            el.style.height = 'auto'; bd.style.height = 'auto'; ct.style.height = 'auto';
            let h = ct.scrollHeight;
            el.style.height = '100%'; bd.style.height = '100%'; ct.style.height = '100%';
            return apiFetch('/api/resize?h=' + h).catch(()=>{});
        }

        // ネットワーク履歴（直近 N サンプル分のスループット）
        const netHistory = [];
        const netMaxSamples = 60;
        // 単位モード: 'byte' は B/s・KB/s・MB/s (1024 基準)、'bit' は bps・Kbps・Mbps (1000 基準)
        // 初期値は 'byte'。/api/settings 取得後に Go 側の値で上書きされる。
        let netUnit = 'byte';
        function formatRate(bytesPerSec){
            // 単位は固定: byte モードは常に KB/s、bit モードは常に Mbps。
            // 値域に応じて小数桁数だけ調整する。
            function withDecimals(v){
                if (v >= 100) return v.toFixed(0);
                if (v >= 10)  return v.toFixed(1);
                return v.toFixed(2);
            }
            if (netUnit === 'bit'){
                const mbps = bytesPerSec * 8 / 1000000;
                return withDecimals(mbps) + ' Mbps';
            }
            const kbs = bytesPerSec / 1024;
            return withDecimals(kbs) + ' KB/s';
        }
        function refreshNetLegend(){
            if (netHistory.length === 0) return;
            const last = netHistory[netHistory.length - 1];
            document.getElementById('net-rx-val').textContent = formatRate(last.rx);
            document.getElementById('net-tx-val').textContent = formatRate(last.tx);
        }
        // net-peak の中身はモードで変える。
        // フル表示: グラフの縦軸スケールとしての直近 60 サンプルのピーク。現在値は
        //           グラフ下の凡例 (↓rx ↑tx) が出す。
        // コンパクト表示 / Wi-Fi 区画の折りたたみ中: グラフも凡例も隠れるので、現在の合計スループット (rx+tx)。
        // 表示中のレイアウトと必ず一致させるため、判定は class を直接見る。
        // 履歴中の最大スループット (rx / tx の大きい方)。
        // グラフの縦軸スケールと、フル表示の net-peak 表示の両方が使う。
        function netPeak(){
            let peak = 0;
            for (const p of netHistory){
                if (p.rx > peak) peak = p.rx;
                if (p.tx > peak) peak = p.tx;
            }
            return peak;
        }
        function updateNetValue(){
            if (netHistory.length === 0) return;
            const el = document.getElementById('net-peak');
            const unitHint = ' / クリックで単位切替 (B ⇔ bit)';
            // 折りたたみ中もグラフ・凡例は隠れるので、コンパクト表示と同じく合計スループットを出す
            if (document.getElementById('dragArea').classList.contains('compact')
                || document.getElementById('wifiSection').classList.contains('collapsed')){
                const last = netHistory[netHistory.length - 1];
                el.textContent = formatRate(last.rx + last.tx);
                el.title = '現在の合計スループット (↓+↑)' + unitHint;
                return;
            }
            if (netHistory.length < 2) return;
            el.textContent = formatRate(netPeak());
            el.title = 'グラフのピーク (直近 2 分)' + unitHint;
        }
        function drawNetGraph(){
            const canvas = document.getElementById('netCanvas');
            if (!canvas) return;
            // 内部解像度を CSS サイズに合わせる（DPI スケール込み）
            const dpr = window.devicePixelRatio || 1;
            const cssW = canvas.clientWidth;
            const cssH = canvas.clientHeight;
            if (cssW === 0 || cssH === 0) return;
            if (canvas.width !== Math.round(cssW*dpr) || canvas.height !== Math.round(cssH*dpr)){
                canvas.width = Math.round(cssW*dpr);
                canvas.height = Math.round(cssH*dpr);
            }
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            // ライトテーマではダーク固定色（白文字・淡い蛍光色）が見えないので、
            // 凡例 (.net-leg-rx/.net-leg-tx) と同じ配色に切り替える。
            const light = document.body.classList.contains('theme-light');
            if (netHistory.length < 2){
                ctx.fillStyle = light ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.35)';
                ctx.font = '10px Segoe UI';
                ctx.fillText('計測中...', 6, cssH/2);
                return;
            }
            // 最低スケール 8KB/s — 無通信時に線がベタ貼り付きにならないように
            const scale = Math.max(netPeak(), 8*1024);
            const step = cssW / (netMaxSamples - 1);
            const offset = netMaxSamples - netHistory.length;
            function drawSeries(getVal, fill, stroke){
                ctx.fillStyle = fill;
                ctx.beginPath();
                ctx.moveTo((offset) * step, cssH);
                netHistory.forEach((p, i) => {
                    const x = (offset + i) * step;
                    const y = cssH - (getVal(p) / scale) * cssH;
                    ctx.lineTo(x, y);
                });
                ctx.lineTo((offset + netHistory.length - 1) * step, cssH);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                netHistory.forEach((p, i) => {
                    const x = (offset + i) * step;
                    const y = cssH - (getVal(p) / scale) * cssH;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }
            drawSeries(p => p.rx,
                light ? 'rgba(26,168,107,0.20)' : 'rgba(127,255,170,0.25)',
                light ? '#1aa86b' : '#7fffaa');
            drawSeries(p => p.tx,
                light ? 'rgba(183,77,166,0.18)' : 'rgba(255,163,255,0.22)',
                light ? '#b74da6' : '#ffa3ff');
        }

        // ============ 設定モーダルと初期化 ============
        const systemThemeMql = window.matchMedia('(prefers-color-scheme: light)');
        function applyTheme(){
            let effective = settings.theme;
            if (effective === 'system') effective = systemThemeMql.matches ? 'light' : 'dark';
            document.body.classList.toggle('theme-light', effective === 'light');
        }
        systemThemeMql.addEventListener('change', () => { if (settings.theme === 'system') applyTheme(); });

        function applyCoreBase(){
            document.querySelectorAll('.core-label[data-core-index]').forEach(el => {
                const i = Number(el.dataset.coreIndex);
                el.textContent = 'Core ' + (i + settings.coreBase);
            });
        }

        // ============ 区画の表示/非表示 ============
        // CPU / メモリ / Wi-Fi は .is-hidden で隠す。GPU / NPU はデバイスの有無でも出し分けるので
        // applyAccelData が settings.hidden を見て表示を決める。
        const hideableSections = { cpu: 'cpu', memory: 'memory', network: 'wifiSection' };
        function updateLastSection(){
            // 最後に見えている区画だけ下余白を 0 にする（:last-child は非表示の区画も数えてしまう）
            const secs = Array.from(document.querySelectorAll('#dragArea > .section')).filter(function(el){
                return getComputedStyle(el).display !== 'none';
            });
            document.querySelectorAll('#dragArea > .section').forEach(function(el){ el.classList.remove('last-visible'); });
            if (secs.length) secs[secs.length - 1].classList.add('last-visible');
        }
        function applyHidden(){
            Object.keys(hideableSections).forEach(function(n){
                const id = hideableSections[n];
                const el = n === 'network' ? document.getElementById(id) : document.querySelector('.section[data-sec="' + id + '"]');
                if (!el) return;
                el.classList.toggle('is-hidden', !!settings.hidden[n]);
                // 非表示の間は裏面（グラフ）の状態を持ち越さない
                if (n === 'network' && settings.hidden[n]) el.classList.remove('flipped');
            });
            applyAccelData(lastGPU, lastNPU);
            updateLastSection();
        }
        // ============ 区画の表示順 ============
        function applyOrder(){
            const area = document.getElementById('dragArea');
            // appendChild は既存の要素を移動する。区画は #dragArea の末尾にまとまっているので、順に付け直せばよい
            settings.order.forEach(function(n){
                const el = area.querySelector(':scope > .section[data-sec="' + n + '"]');
                if (el) area.appendChild(el);
            });
            updateLastSection();
        }
        // 設定は別ウィンドウ（/settings）で開く。変更は /api/settingschanged 経由で
        // window.__settingsChanged に届き、applyServerSettings で反映する。
        document.getElementById('settingsBtn').addEventListener('click', function(e){
            e.stopPropagation();
            apiFetch('/api/opensettings').catch(function(){});
        });

        // ============ 区画の折りたたみ（D10）============
        // 開閉は各見出しのシェブロン（▼）のクリックだけ。Wi-Fi は区画のどこをクリックしても表裏が
        // 反転するため、見出し全体のクリックにはしない。状態は Go 側の config.json に保存される。
        const collapsibleSections = ['cpu', 'memory', 'gpu', 'npu', 'network', 'ai'];
        function applyCollapsed(){
            collapsibleSections.forEach(function(n){
                const el = document.querySelector('.section[data-sec="' + n + '"]');
                if (!el) return;
                const c = !!(settings.collapsed && settings.collapsed[n]);
                el.classList.toggle('collapsed', c);
                el.querySelectorAll('.chev').forEach(function(b){ b.title = c ? '展開' : '折りたたむ'; });
                // Wi-Fi は折りたたむと表面に戻す。展開後は表面から始まる（裏面のグラフは再描画される）。
                if (n === 'network' && c) el.classList.remove('flipped');
            });
            // net-peak の中身は折りたたみ状態でも変わるので、次の周期を待たずに付け替える
            updateNetValue();
        }
        let heightTimer = 0;
        function scheduleHeightAdjust(){
            clearTimeout(heightTimer);
            heightTimer = setTimeout(adjustWindowHeight, 40);
        }
        document.querySelectorAll('.chev').forEach(function(b){
            // 区画（Wi-Fi の反転）やドラッグ開始へ伝えない
            b.addEventListener('click', function(e){
                e.stopPropagation();
                const n = b.dataset.sec;
                settings.collapsed[n] = !settings.collapsed[n];
                apiFetch('/api/setoption?key=collapse.' + n + '&value=' + (settings.collapsed[n] ? 'true' : 'false')).catch(function(){});
                applyCollapsed();
                scheduleHeightAdjust();
                setTimeout(function(){ apiFetch('/api/persistwindow').catch(function(){}); }, 300);
            });
        });

        // ============ AI 使用量（Claude / Codex）============
        const ai = { settings: null, usage: null, status: null, html: '', sum: '', comp: '', timer: 0, statusTimer: 0, rotateTimer: 0 };
        const AI_PROVIDERS = [
            { id: 'claude', name: 'Claude', letter: 'C', cls: 'claude', flag: 'claudeEnabled' },
            { id: 'codex',  name: 'Codex',  letter: 'X', cls: 'codex',  flag: 'codexEnabled' }
        ];
        const JP_WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
        // 外部（サービス側）由来の文字列は必ずエスケープして埋め込む
        function aiEsc(s){
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // 表示する窓: ラベルのあるものだけ。まだ取得できていないときは 5h / 7d の枠だけ出す。

        function aiProviderHtml(p, u, st){

        // 折りたたみ時・コンパクト時用。プロバイダごとに 1 行。状態は記号ではなく短い語で出す

        function aiCompactHtml(){

        function renderAI(){

        // 折りたたみ / コンパクト表示の見せ方。"rotate"（自動）と "click"（クリック）は 2 行を重ねて、

        const AI_ROTATE_MS = 4000;
        function applyAICompactDisplay(){
            const box = document.getElementById('ai-compact');

                ai.rotateTimer = setInterval(function(){

        // 行を入れ替える。折りたたみ（フル表示）では Wi-Fi 区画と同じく枠ごと横回転させ、

        let aiFlipBusy = false;
        function aiFlip(){
            const box = document.getElementById('ai-compact');

                && sec.classList.contains('collapsed') && sec.classList.contains('ai-rot');

                sec.classList.remove('ai-flip-out');
                sec.classList.add('ai-flip-snap');

            }, 285);
        }
        // クリックで反転（"click" のとき）。Wi-Fi と同じく区画のどこをクリックしても反転し、

        // ログイン待ち・取得中は短い間隔で、安定したら長い間隔で見る（Go 側の取得は既定 5 分ごと）

        async function aiFetchUsage(){

        }

        // 見出しの「今すぐ更新」。取得が終わるまで回し、終わったら最新の値と障害状況を描き直す。

        // Go 側の永続設定を UI に反映する。起動時（initial）と、設定ウィンドウで変更されたとき

        function applyServerSettings(s, initial){

        // ============ GPU / NPU ============
        // 表示用の % は 0〜100 にクランプする（Go 側は生値を保持している）。null は '---'。

            used = Number(used) || 0; total = Number(total) || 0;
            const GB = 1024*1024*1024, MB = 1024*1024;
            const inGB = (total > 0 ? total : used) >= GB;
            const fmt = v => inGB ? (v/GB).toFixed(1) : Math.round(v/MB).toString();

        let lastGPU = null, lastNPU = null;
        // GPU・NPU セクションの可視性。lastConnMode と同じく、変化したら高さを測り直して保存する。
        // 起動直後の初回は初期化処理（updateData().then）側で高さを合わせるので対象外。

        // "Intel(R) Core(TM) Ultra 7 240H" → "Intel Core Ultra 7 240H" のように、

        function cleanDeviceName(s){
            if (!s) return '';

                .replace(/\((?:R|TM|C)\)/gi, ' ')
                .replace(/[®™]/g, ' ')

        // モデル名を要素に流し込む。空なら行ごと消す（余白だけ残らないように）。

        function applyAccelData(gpu, npu){

        // 接続種別（Wi-Fi / Ethernet / 未接続）で情報行数が変わり、必要な高さも変わる。
        // 起動直後は未確定のまま高さを測ってしまうので、種別が変わったら測り直す。
        let lastConnMode = '';
        async function updateData(){
            try{ const res=await apiFetch('/api/system'); const data=await res.json();
                if(data.CPU){ const o=Math.round(data.CPU.Overall); document.getElementById('cpu-overall').textContent=o+'%'; document.getElementById('cpu-bar').style.width=o+'%'; const c=document.getElementById('cores-container'); if(c.children.length===0 && data.CPU.Cores){ data.CPU.Cores.forEach((_,i)=>{ const d=document.createElement('div'); d.className='core-item'; d.innerHTML='<span class="core-label" data-core-index="'+i+'">Core '+(i+settings.coreBase)+'</span><div class="core-bar-container"><div class="core-bar" id="core-bar-'+i+'"></div></div><span class="core-value" id="core-value-'+i+'">0%</span>'; c.appendChild(d);}); applyCoreBase(); }
                    if(data.CPU.Cores){ data.CPU.Cores.forEach((load,i)=>{ const bar=document.getElementById('core-bar-'+i); const val=document.getElementById('core-value-'+i); if(bar&&val){ const r=Math.round(load); bar.style.height=r+'%'; val.textContent=r+'%'; } }); }}

                updatePowerMode(data.PowerMode);
                updateClock(data.CPUFreq);
                applyAccelData(data.GPU, data.NPU);
                if(data.Memory){ const p=Math.round(data.Memory.UsedPercent); document.getElementById('memory-percent').textContent=p+'%'; document.getElementById('memory-bar').style.width=p+'%'; document.getElementById('memory-used').textContent=formatBytes(data.Memory.Used); document.getElementById('memory-total').textContent='/ '+formatBytes(data.Memory.Total); }
                if(data.Network){ const rx=Number(data.Network.RxBytesPerSec)||0; const tx=Number(data.Network.TxBytesPerSec)||0; netHistory.push({rx, tx}); if(netHistory.length>netMaxSamples) netHistory.shift(); document.getElementById('net-rx-val').textContent=formatRate(rx); document.getElementById('net-tx-val').textContent=formatRate(tx); updateNetValue(); if(wifiSection.classList.contains('flipped')) drawNetGraph(); }
                const ssid=document.getElementById('wifi-ssid');
                const connIcon=document.getElementById('conn-icon');
                const connTitle=document.getElementById('conn-title');
                const ssidLabel=document.getElementById('wifi-ssid-label');
                const connSection=document.getElementById('wifiSection');
                if(data.WiFi && data.WiFi.SSID){
                    connSection.classList.remove('ethernet-mode');
                    connIcon.textContent='📶'; connTitle.textContent='Wi-Fi'; connTitle.dataset.compact='Wi-Fi'; ssidLabel.textContent='SSID';
                    ssid.textContent=data.WiFi.SSID; ssid.className='wifi-value wifi-connected';
                    let band=data.WiFi.Band; if(data.WiFi.Channel>0){ band+=' (Ch '+data.WiFi.Channel+')'; }
                    document.getElementById('wifi-band').textContent=band;
                    document.getElementById('wifi-type').textContent=wifiStandards[data.WiFi.Type]||data.WiFi.Type;
                    document.getElementById('wifi-signal').textContent=data.WiFi.Signal+'%';
                    let compact=data.WiFi.Band; if(data.WiFi.Channel>0){ compact+='('+data.WiFi.Channel+'ch)'; }
                    document.getElementById('wifi-compact').textContent=compact;
                } else if(data.Ethernet && data.Ethernet.Connected){
                    connSection.classList.add('ethernet-mode');
                    connIcon.textContent='🔌'; connTitle.textContent='Ethernet'; connTitle.dataset.compact='LAN'; ssidLabel.textContent='アダプタ';
                    ssid.textContent=data.Ethernet.Name; ssid.className='wifi-value wifi-connected';
                    const spdStr=formatLinkSpeed(data.Ethernet.LinkSpeedBps);
                    document.getElementById('eth-speed').textContent=spdStr;
                    document.getElementById('wifi-compact').textContent=(spdStr==='---')?'Ethernet':spdStr;
                } else {
                    connSection.classList.remove('ethernet-mode');
                    connIcon.textContent='📶'; connTitle.textContent='Wi-Fi'; connTitle.dataset.compact='Wi-Fi'; ssidLabel.textContent='SSID';
                    ssid.textContent='未接続'; ssid.className='wifi-value wifi-disconnected';
                    document.getElementById('wifi-band').textContent='---';
                    document.getElementById('wifi-type').textContent='---';
                    document.getElementById('wifi-signal').textContent='---';
                    document.getElementById('wifi-compact').textContent='未接続';
                }
                const connMode = connSection.classList.contains('ethernet-mode') ? 'eth'
                    : (ssid.classList.contains('wifi-connected') ? 'wifi' : 'none');
                if (connMode !== lastConnMode) {
                    const first = lastConnMode === '';
                    lastConnMode = connMode;
                    if (!first) setTimeout(adjustWindowHeight, 50);
                }
                // サーバーとの viewMode 同期
                if (data.ViewMode !== undefined && data.ViewMode !== currentViewMode) {
                    currentViewMode = data.ViewMode;
                    if (currentViewMode === 0) {
                        document.getElementById('dragArea').classList.remove('compact');
                        setTimeout(adjustWindowHeight, 50);
                    } else if (currentViewMode === 1) {
                        document.getElementById('dragArea').classList.add('compact');
                        setTimeout(adjustWindowHeight, 50);
                    }
                    // net-peak の中身はモードで変わるので、次の周期を待たずに付け替える
                    updateNetValue();
                }
            }catch(e){ console.error('Update error:',e); }
        }
        // クロック行が収まる最小幅。旧バージョンの config.json には幅 210 が保存されている
        // ため、初回だけ実測して狭ければ広げる（ユーザーがこれより広くしている場合は触らない）。
        const minContentWidth = 230;
        async function ensureMinWidth(){
            // コンパクト表示は専用の幅 (Go 側の compactWindowWidth) を使うので、
            // フル表示向けのこの下限は適用しない。
            if (currentViewMode === 1) return;
            try{
                const res = await apiFetch('/api/windowsize');
                const d = await res.json();
                if(d.width && d.width < minContentWidth){
                    await apiFetch('/api/resize?w=' + minContentWidth);
                }
            }catch(e){}
        }
        let heightAdjusted = false;
        updateData().then(async ()=>{
            await ensureMinWidth();
            // コア別バーは初回データ受信時に生成されるので、ここで初めて自然高さが確定する
            const firstAdjust = adjustWindowHeight();
            setTimeout(adjustWindowHeight, 300);
            setTimeout(()=>apiFetch('/api/persistwindow').catch(()=>{}), 500);
            heightAdjusted = true;
            // テーマ（設定の取得）と初回の高さが済んだら、Go 側が非表示で作った窓を出す。
            // 失敗しても、Go 側のタイマーで一定時間後に必ず表示される。
            try{ await settingsLoaded; await firstAdjust; }catch(e){}
            apiFetch('/api/ready').catch(()=>{});
        });
        setInterval(updateData,2000);
        window.addEventListener('load', function() {
            if(!heightAdjusted){ setTimeout(adjustWindowHeight, 350); setTimeout(adjustWindowHeight, 1000); }
        });
    </script>
</body>
</html>
