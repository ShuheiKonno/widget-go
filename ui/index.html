            return applySkin(settings.skin);
        }
        // 設定の取得は初回も再取得もここを通す。取得の開始前に世代を進め、応答が逆順に届いても
        // 古い設定（スキン・テーマなど）が新しい設定を巻き戻さないよう、最新の取得の応答だけを適用する。
        let settingsGen = 0;
        let settingsLatest = Promise.resolve();
        // 起動時の取得が捨てられても、初回の処理（コンパクト幅の適用など）は最初に適用される応答で行う
        let settingsInitialPending = true;
        function loadServerSettings(initial){
            const gen = ++settingsGen;
            settingsLatest = apiFetch('/api/settings').then(r => r.json()).then(function(s){
                // 後から新しい取得が始まっていたら、この応答は捨てて最新の完了を待つ
                if (gen !== settingsGen) return settingsLatest;
                const first = initial || settingsInitialPending;
                settingsInitialPending = false;
                return applyServerSettings(s, first);
            });
            return settingsLatest;
        }
        const settingsLoaded = loadServerSettings(true).catch(()=>{ applyTheme(); });
        // 設定ウィンドウで変更されたとき、Go 側が呼ぶ（/api/settingschanged）。
        window.__settingsChanged = function(){
            loadServerSettings(false).catch(function(){});
        };

        // ============ GPU / NPU ============
        // 表示用の % は 0〜100 にクランプする（Go 側は生値を保持している）。null は '---'。
        function accelPct(v){
            if (v === null || v === undefined || !isFinite(v)) return null;
            return Math.min(100, Math.max(0, v));
        }
        function formatAccelPct(v){ const p = accelPct(v); return p === null ? '---' : Math.round(p) + '%'; }
        // 容量が 1GB 以上なら GB（小数 1 桁）、未満なら MB で表す。分母 0 は比率を出さず使用量だけ。
        function formatAccelMem(used, total){
            used = Number(used) || 0; total = Number(total) || 0;
            const GB = 1024*1024*1024, MB = 1024*1024;
            const inGB = (total > 0 ? total : used) >= GB;
            const fmt = v => inGB ? (v/GB).toFixed(1) : Math.round(v/MB).toString();
            const unit = inGB ? ' GB' : ' MB';
            return total > 0 ? fmt(used) + ' / ' + fmt(total) + unit : fmt(used) + unit;
        }
        let lastGPU = null, lastNPU = null;
        // GPU・NPU セクションの可視性。lastConnMode と同じく、変化したら高さを測り直して保存する。
        // 起動直後の初回は初期化処理（updateData().then）側で高さを合わせるので対象外。
        let lastAccelMode = '';
        // "Intel(R) Core(TM) Ultra 7 240H" → "Intel Core Ultra 7 240H" のように、
        // 商標記号や "CPU @ 3.60GHz"（クロックは専用の行で出している）といった
        // 冗長な部分を落とす。全文は title 属性に残す。
        function cleanDeviceName(s){
            if (!s) return '';
            return String(s)
                .replace(/\((?:R|TM|C)\)/gi, ' ')
                .replace(/[®™]/g, ' ')
                .replace(/\s*@.*$/, '')
                .replace(/\b(?:CPU|Processor)\b/gi, ' ')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }
        // モデル名を要素に流し込む。空なら行ごと消す（余白だけ残らないように）。
        function setModelName(id, raw){
            const el = document.getElementById(id);
            if (!el) return;
            const name = cleanDeviceName(raw);
            el.textContent = name;
            el.title = raw || '';
            el.classList.toggle('is-empty', name === '');
        }

        function applyAccelData(gpu, npu){
            lastGPU = gpu || null; lastNPU = npu || null;
            const showG = !!(!settings.hidden.gpu && lastGPU);
            const showN = !!(!settings.hidden.npu && lastNPU);
            document.getElementById('gpuSection').style.display = showG ? '' : 'none';
            document.getElementById('npuSection').style.display = showN ? '' : 'none';
            if (showG) {
                const g = lastGPU;
                const total = accelPct(g.TotalPct);
                document.getElementById('gpu-total').textContent = formatAccelPct(g.TotalPct);
                document.getElementById('gpu-bar').style.width = (total === null ? 0 : total).toFixed(1) + '%';
                document.getElementById('gpu-dedicated').textContent = formatAccelMem(g.DedicatedUsed, g.DedicatedTotal);
                document.getElementById('gpu-shared').textContent = formatAccelMem(g.SharedUsed, g.SharedTotal);
                setModelName('gpu-model', g.Name);
            }
            if (showN) {
                const n = lastNPU;
                const usage = accelPct(n.UsagePct);
                document.getElementById('npu-usage').textContent = formatAccelPct(n.UsagePct);
                document.getElementById('npu-bar').style.width = (usage === null ? 0 : usage).toFixed(1) + '%';
                setModelName('npu-model', n.Name);
            }
            const mode = (showG ? 'G' : '-') + (showN ? 'N' : '-');
            if (mode !== lastAccelMode) {
                const first = lastAccelMode === '';
                lastAccelMode = mode;
                if (!first) {
                    setTimeout(adjustWindowHeight, 50);
                    // adjustWindowHeight の resize 完了後に保存する（直後だと変更前のサイズが残る）
                    setTimeout(() => apiFetch('/api/persistwindow').catch(()=>{}), 300);
                }
            }
        }

        // ============ Disk ============
        // 容量は 1 TB 以上なら TB、100 GB 以上なら整数の GB、それ未満は小数 1 桁の GB、1 GB 未満は MB。
        function formatDiskSize(b){
            b = Number(b) || 0;
            const GB = 1024*1024*1024, MB = 1024*1024, TB = GB*1024;
            if (b >= TB) return (b/TB).toFixed(2) + ' TB';
            if (b >= GB) return (b/GB).toFixed(b >= 100*GB ? 0 : 1) + ' GB';
            return Math.round(b/MB) + ' MB';
        }
        // I/O の速度（バイト/秒）。ネットワークと違い、単位の切替設定には従わず常にバイト系で出す。
        function formatDiskRate(v){
            if (v === null || v === undefined || !isFinite(v)) return '---';
            const KB = 1024, MB = KB*1024, GB = MB*1024;
            if (v >= GB) return (v/GB).toFixed(1) + ' GB/s';
            if (v >= MB) return (v/MB).toFixed(v >= 10*MB ? 0 : 1) + ' MB/s';
            if (v >= KB) return Math.round(v/KB) + ' KB/s';
            return Math.round(v) + ' B/s';
        }
        const DISK_WARN_PCT = 90; // 使用率がこれ以上のドライブは警告色にする
        const DISK_GRAPH_MIN_SCALE = 1024*1024; // グラフの縦軸の下限（1 MB/s）。ほぼ無負荷のときに線が上下に振れすぎないように
        let lastDisk = null;
        // I/O の履歴（読み取り r / 書き込み w、バイト/秒）。Network と同じ直近 60 サンプルを、
        // 表の面を見ている間や数値表示の間も貯める（反転したときにすぐ線が出る）。
        const diskHistory = [];
        // 見えているドライブ構成（表示 + ドライブ数 + I/O の見せ方 + モデル名の行数）。変わると高さが変わるので測り直す。
        let lastDiskKey = '';
        // 裏面を見ていて、グラフ表示のときだけ描く
        function redrawDiskGraph(){
            if (!document.getElementById('diskSection').classList.contains('flipped') || settings.diskIoView !== 'graph') return;
            drawRateGraph('diskCanvas', diskHistory, p => p.r, p => p.w, DISK_GRAPH_MIN_SCALE);
        }
        // fresh は /api/system で届いた新しい値のとき true。設定や表示/非表示の変更による描き直しでは
        // 同じ値を履歴に二重に積まないよう false で呼ぶ。
        function applyDiskData(disk, fresh){
            lastDisk = disk || null;
            const sec = document.getElementById('diskSection');
            const drives = (lastDisk && lastDisk.Drives) || [];
            const io = lastDisk && lastDisk.IO;
            const graph = settings.diskIoView === 'graph';
            if (fresh) {
                if (!lastDisk) diskHistory.length = 0;   // 収集が止まると間が空くので捨てる
                else {
                    // 取れなかった周期（ベースライン直後や PDH の一時的な失敗）も 0 として積む。積まないと、
                    // グラフが直前の値のまま止まり（数値は --- になる）、時間軸も詰まってしまう。
                    diskHistory.push({ r: Number(io && io.ReadBps) || 0, w: Number(io && io.WriteBps) || 0 });
                    if (diskHistory.length > netMaxSamples) diskHistory.shift();
                }
            }
            const show = !settings.hidden.disk && !!(lastDisk && (drives.length || io));
            sec.style.display = show ? '' : 'none';
            sec.classList.toggle('disk-io-graph', graph);
            // データ待ち・取得不可で隠れている間も、いま出している面（settings.flipped）は変えない
            if (show) {
                let used = 0, total = 0;
                drives.forEach(function(d){ used += Number(d.Used) || 0; total += Number(d.Total) || 0; });
                const pct = total > 0 ? Math.min(100, used * 100 / total) : null;
                document.getElementById('disk-percent').textContent = pct === null ? '---' : Math.round(pct) + '%';
                document.getElementById('disk-bar').style.width = (pct === null ? 0 : pct).toFixed(1) + '%';
                // モデル名（物理ディスクの製品名）。ドライブごとの重複は 1 つにまとめ、1 つにつき 1 行。
                // 構成が変わったときだけ作り直す。取れなければ行ごと無し。
                const models = [];
                drives.forEach(function(d){ if (d.Model && models.indexOf(d.Model) < 0) models.push(d.Model); });
                const modelBox = document.getElementById('disk-models');
                if (modelBox.dataset.models !== models.join('\n')) {
                    modelBox.dataset.models = models.join('\n');
                    modelBox.textContent = '';
                    models.forEach(function(m){
                        const row = document.createElement('div');
                        row.className = 'model-name';
                        row.textContent = m;
                        row.title = m;
                        modelBox.appendChild(row);
                    });
                }
                const box = document.getElementById('disk-drives');
                // 構成（ドライブ文字）が変わったときだけ行を作り直し、普段は値の書き換えだけにする
                const letters = drives.map(function(d){ return d.Letter; }).join(',');
                if (box.dataset.letters !== letters) {
                    box.dataset.letters = letters;
                    box.textContent = '';
                    drives.forEach(function(d){
                        const row = document.createElement('div');
                        row.className = 'wifi-row disk-drive';
                        const lab = document.createElement('span'); lab.className = 'wifi-label'; lab.textContent = d.Letter;
                        const val = document.createElement('span'); val.className = 'wifi-value';
                        row.appendChild(lab); row.appendChild(val);
                        box.appendChild(row);
                    });
                }
                drives.forEach(function(d, i){
                    const row = box.children[i];
                    if (!row) return;
                    const p = Number(d.UsedPercent) || 0;
                    row.querySelector('.wifi-value').textContent = formatDiskSize(d.Used) + ' / ' + formatDiskSize(d.Total) + ' (' + Math.round(p) + '%)';
                    row.classList.toggle('disk-warn', p >= DISK_WARN_PCT);
                });
                // 裏面（I/O）。見出しにはアクティブな時間を出す（コンパクト・折りたたみ時はこれだけが見える）
                const active = io ? accelPct(io.ActivePct) : null;
                document.getElementById('disk-active-head').textContent = active === null ? '---' : Math.round(active) + '%';
                document.getElementById('disk-active-bar').style.width = (active === null ? 0 : active).toFixed(1) + '%';
                const rd = formatDiskRate(io ? io.ReadBps : null), wr = formatDiskRate(io ? io.WriteBps : null);
                document.getElementById('disk-read').textContent = rd;
                document.getElementById('disk-write').textContent = wr;
                document.getElementById('disk-read-val').textContent = rd;
                document.getElementById('disk-write-val').textContent = wr;
                if (fresh) redrawDiskGraph();
            }
            const key = show ? 'D' + drives.length + (graph ? 'g' : 'n') + 'm' + document.getElementById('disk-models').children.length : '-';
            if (key !== lastDiskKey) {
                const first = lastDiskKey === '';
                lastDiskKey = key;
                if (!first) {
                    setTimeout(adjustWindowHeight, 50);
                    // adjustWindowHeight の resize 完了後に保存する（直後だと変更前のサイズが残る）
                    setTimeout(() => apiFetch('/api/persistwindow').catch(()=>{}), 300);
                }
            }
        }

        // 接続種別（Wi-Fi / Ethernet / 未接続）で情報行数が変わり、必要な高さも変わる。
        // 起動直後は未確定のまま高さを測ってしまうので、種別が変わったら測り直す。
        let lastConnMode = '';
        async function updateData(){
            try{ const res=await apiFetch('/api/system'); const data=await res.json();
                if(data.CPU){ const o=Math.round(data.CPU.Overall); document.getElementById('cpu-overall').textContent=o+'%'; document.getElementById('cpu-bar').style.width=o+'%'; const c=document.getElementById('cores-container'); if(c.children.length===0 && data.CPU.Cores){ data.CPU.Cores.forEach((_,i)=>{ const d=document.createElement('div'); d.className='core-item'; d.innerHTML='<span class="core-label" data-core-index="'+i+'">Core '+(i+settings.coreBase)+'</span><div class="core-bar-container"><div class="core-bar" id="core-bar-'+i+'"></div></div><span class="core-value" id="core-value-'+i+'">0%</span>'; c.appendChild(d);}); applyCoreBase(); }
                    if(data.CPU.Cores){ data.CPU.Cores.forEach((load,i)=>{ const bar=document.getElementById('core-bar-'+i); const val=document.getElementById('core-value-'+i); if(bar&&val){ const r=Math.round(load); bar.style.height=r+'%'; val.textContent=r+'%'; } }); }}
                updatePowerMode(data.PowerMode);
                updateClock(data.CPUFreq);
                applyAccelData(data.GPU, data.NPU);
                applyDiskData(data.Disk, true);
                applyWorkTimer(data.WorkTimer);
                applyPomodoro(data.Pomodoro);
                applyPing(data.Ping);
                if(data.Memory){ const p=Math.round(data.Memory.UsedPercent); document.getElementById('memory-percent').textContent=p+'%'; document.getElementById('memory-bar').style.width=p+'%'; document.getElementById('memory-used').textContent=formatBytes(data.Memory.Used); document.getElementById('memory-total').textContent='/ '+formatBytes(data.Memory.Total); }
                if(data.Network){ const rx=Number(data.Network.RxBytesPerSec)||0; const tx=Number(data.Network.TxBytesPerSec)||0; netHistory.push({rx, tx}); if(netHistory.length>netMaxSamples) netHistory.shift(); document.getElementById('net-rx-val').textContent=formatRate(rx); document.getElementById('net-tx-val').textContent=formatRate(tx); updateNetValue(); if(wifiSection.classList.contains('flipped')) drawNetGraph(); }
                const ssid=document.getElementById('wifi-ssid');
                const connIcon=document.getElementById('conn-icon');
                const connTitle=document.getElementById('conn-title');
                const ssidLabel=document.getElementById('wifi-ssid-label');
                const connSection=document.getElementById('wifiSection');
                if(data.WiFi && data.WiFi.SSID){
                    connSection.classList.remove('ethernet-mode');
                    connIcon.textContent='📶'; connTitle.textContent='Wi-Fi'; connTitle.dataset.compact='Wi-Fi'; ssidLabel.textContent='SSID';
                    ssid.textContent=data.WiFi.SSID; ssid.className='wifi-value wifi-connected';
                    setModelName('net-model', data.WiFi.Description);
                    let band=data.WiFi.Band; if(data.WiFi.Channel>0){ band+=' (Ch '+data.WiFi.Channel+')'; }
                    document.getElementById('wifi-band').textContent=band;
                    document.getElementById('wifi-type').textContent=wifiStandards[data.WiFi.Type]||data.WiFi.Type;
                    document.getElementById('wifi-signal').textContent=data.WiFi.Signal+'%';
                    let compact=data.WiFi.Band; if(data.WiFi.Channel>0){ compact+='('+data.WiFi.Channel+'ch)'; }
                    document.getElementById('wifi-compact').textContent=compact;
                } else if(data.Ethernet && data.Ethernet.Connected){
                    connSection.classList.add('ethernet-mode');
                    connIcon.textContent='🔌'; connTitle.textContent='Ethernet'; connTitle.dataset.compact='LAN'; ssidLabel.textContent='アダプタ';
                    ssid.textContent=data.Ethernet.Name; ssid.className='wifi-value wifi-connected';
                    setModelName('net-model', data.Ethernet.Description);
                    const spdStr=formatLinkSpeed(data.Ethernet.LinkSpeedBps);
                    document.getElementById('eth-speed').textContent=spdStr;
                    document.getElementById('wifi-compact').textContent=(spdStr==='---')?'Ethernet':spdStr;
                } else {
                    connSection.classList.remove('ethernet-mode');
                    connIcon.textContent='📶'; connTitle.textContent='Wi-Fi'; connTitle.dataset.compact='Wi-Fi'; ssidLabel.textContent='SSID';
                    ssid.textContent='未接続'; ssid.className='wifi-value wifi-disconnected';
                    setModelName('net-model', '');
                    document.getElementById('wifi-band').textContent='---';
                    document.getElementById('wifi-type').textContent='---';
                    document.getElementById('wifi-signal').textContent='---';
                    document.getElementById('wifi-compact').textContent='未接続';
                }
                const connMode = connSection.classList.contains('ethernet-mode') ? 'eth'
                    : (ssid.classList.contains('wifi-connected') ? 'wifi' : 'none');
                if (connMode !== lastConnMode) {
                    const first = lastConnMode === '';
                    lastConnMode = connMode;
                    if (!first) setTimeout(adjustWindowHeight, 50);
                }
                // サーバーとの viewMode 同期
                if (data.ViewMode !== undefined && data.ViewMode !== currentViewMode) {
                    currentViewMode = data.ViewMode;
                    if (currentViewMode === 0) {
                        document.getElementById('dragArea').classList.remove('compact');
                        setTimeout(adjustWindowHeight, 50);
                    } else if (currentViewMode === 1) {
                        document.getElementById('dragArea').classList.add('compact');
                        setTimeout(adjustWindowHeight, 50);
                    }
                    // net-peak の中身はモードで変わるので、次の周期を待たずに付け替える
                    updateNetValue();
                }
            }catch(e){ console.error('Update error:',e); }
        }
        // クロック行が収まる最小幅。旧バージョンの config.json には幅 210 が保存されている
        // ため、初回だけ実測して狭ければ広げる（ユーザーがこれより広くしている場合は触らない）。
        const minContentWidth = 230;
        async function ensureMinWidth(){
            // コンパクト表示は専用の幅 (Go 側の compactWindowWidth) を使うので、
            // フル表示向けのこの下限は適用しない。
            if (currentViewMode === 1) return;
            try{
                const res = await apiFetch('/api/windowsize');
                const d = await res.json();
                if(d.width && d.width < minContentWidth){
                    await apiFetch('/api/resize?w=' + minContentWidth);
                }
            }catch(e){}
        }
        let heightAdjusted = false;
        updateData().then(async ()=>{
            await ensureMinWidth();
            // コア別バーは初回データ受信時に生成されるので、ここで初めて自然高さが確定する
            const firstAdjust = adjustWindowHeight();
            setTimeout(adjustWindowHeight, 300);
            setTimeout(()=>apiFetch('/api/persistwindow').catch(()=>{}), 500);
            heightAdjusted = true;
            // テーマ（設定の取得）と初回の高さが済んだら、Go 側が非表示で作った窓を出す。
            // 失敗しても、Go 側のタイマーで一定時間後に必ず表示される。
            try{ await settingsLoaded; await firstAdjust; }catch(e){}
            apiFetch('/api/ready').catch(()=>{});
        });
        setInterval(updateData,2000);
        window.addEventListener('load', function() {
            if(!heightAdjusted){ setTimeout(adjustWindowHeight, 350); setTimeout(adjustWindowHeight, 1000); }
        });
    </script>
</body>
</html>
