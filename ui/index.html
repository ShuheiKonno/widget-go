    <script nonce="__WIDGET_TOKEN__">
        // 全 /api 呼び出しに付与する CSRF トークン（Go 側が起動毎に生成し埋め込む）。
        const WIDGET_TOKEN = '__WIDGET_TOKEN__';
        // fetch のラッパー。X-Widget-Token カスタムヘッダを必ず付与する。
        // サーバー側 securityMiddleware がこのヘッダを検証し、外部ページからの
        // CSRF リクエスト（カスタムヘッダを付けられない単純リクエスト）を弾く。
        function apiFetch(url, opts){
            opts = opts || {};
            opts.headers = Object.assign({}, opts.headers, { 'X-Widget-Token': WIDGET_TOKEN });
            return fetch(url, opts);
        }
        const wifiStandards = { '802.11a':'802.11a','802.11b':'802.11b','802.11g':'802.11g','802.11n':'802.11n (Wi-Fi 4)','802.11ac':'802.11ac (Wi-Fi 5)','802.11ax':'802.11ax (Wi-Fi 6)','802.11be':'802.11be (Wi-Fi 7)' };
        function formatBytes(b){return (b/(1024*1024*1024)).toFixed(1)+' GB';}
        // Ethernet 標準速度 (10/100/1000/2500/5000/10000 Mbps) から ±2% 以内ならスナップ。
        // ドライバが 1Gbps リンクを 995Mbps と報告するようなケースへの対策。
        function snapEthernetLinkSpeedMbps(mbps){
            const standards = [10, 100, 1000, 2500, 5000, 10000];
            for (const s of standards){
                if (Math.abs(mbps - s) / s <= 0.02) return s;
            }
            return mbps;
        }
        function formatLinkSpeed(bps){
            if(!bps || bps <= 0) return '---';
            const mbps = snapEthernetLinkSpeedMbps(bps / 1000000);
            if (mbps >= 1000){
                const gbps = mbps / 1000;
                return (gbps % 1 === 0 ? gbps.toFixed(0) : gbps.toFixed(1)) + ' Gbps';
            }
            return Math.round(mbps) + ' Mbps';
        }

        // CPU クロック表示。
        // 現在クロックは PDH の "% Processor Performance" × ベースクロックで算出された値
        // （タスクマネージャーの「速度」と同じ）。ターボ時はベースを超える。
        // バーのスケール上限は「ベース×2」を基準にし、観測した最大がそれを超えた場合のみ追随する。
        let clockObservedMaxMHz = 0;
        // バーの色の境界（ベースクロックとの差を整数 % に丸めた値）。-10〜+20 は青、これ以下は緑、これ以上は橙。
        const CLOCK_LOW_MAX_PCT = -11;
        const CLOCK_HIGH_MIN_PCT = 21;
        function formatClock(mhz){
            if(!mhz || mhz <= 0) return '--- GHz';
            if(mhz >= 1000) return (mhz/1000).toFixed(2) + ' GHz';
            return Math.round(mhz) + ' MHz';
        }
        function updateClock(f){
            const valueEl = document.getElementById('cpu-clock');
            const baseEl = document.getElementById('cpu-clock-base');
            const bar = document.getElementById('clock-bar');
            const marker = document.getElementById('clock-base-marker');
            if(!f || !f.BaseMHz){
                valueEl.textContent = '--- GHz';
                baseEl.textContent = 'base ---';
                bar.style.width = '0%';
                bar.classList.remove('clk-low', 'clk-high');
                return;
            }
            const cur = f.CurrentMHz || 0;
            const base = f.BaseMHz;
            valueEl.textContent = formatClock(cur);
            // 幅を節約するため base 表記だけ数値と単位を詰める
            baseEl.textContent = 'base ' + formatClock(base).replace(' ', '');
            if(cur > clockObservedMaxMHz) clockObservedMaxMHz = cur;
            const scaleMax = Math.max(base * 2, clockObservedMaxMHz * 1.05);
            bar.style.width = Math.min(100, cur / scaleMax * 100).toFixed(1) + '%';
            marker.style.left = (base / scaleMax * 100).toFixed(1) + '%';
            // 色は電源モードではなく、ベースクロックとの差で決める。
            // トレイの帯（tray.go の trayAccentColor）も同じ規則。CLOCK_*_PCT と同じ値にすること
            // （tray_test.go の TestClockThresholdsMatchFrontend が一致を確かめる）。
            const pct = Math.round((cur / base - 1) * 100);
            bar.classList.toggle('clk-low', pct <= CLOCK_LOW_MAX_PCT);
            bar.classList.toggle('clk-high', pct >= CLOCK_HIGH_MIN_PCT);
        }

        // ============ 電源モード（設定アプリの「電源モード」）============
        // 状態は /api/system の PowerMode（{planOK, active}、取得できない環境では null）。
        // OS の状態なので config.json には保存しない。設定アプリでの変更も 2 秒周期の更新で追従する。
        // 電源プランがバランス以外のときは、効かないので 3 ボタンとも無効にする（サーバー側も 409 で拒否する）。
        // 3 段階のスライダー。つまみの位置 0 / 1 / 2 が POWER_MODES の添字に対応する。
        // ドラッグ中は表示（ラベルの強調）だけを追従させ、指を離したとき（change）に切り替える。
        const POWER_MODES = ['saver', 'balanced', 'best'];
        const powerModeNames = { saver: '最適な電力効率', balanced: 'バランス', best: '最適なパフォーマンス' };
        const powerPlanLockedTip = '電源プランが「バランス」以外のため切り替えできません';
        const powerRow = document.getElementById('powerMode');
        const powerSlider = document.getElementById('pmSlider');
        let lastPowerMode = null;   // 直近にサーバーから得た状態（失敗時にここへ戻す）
        let powerModeShown = false;
        let powerModeBusy = false;  // 切替要求の処理中。二重操作と、途中の更新による表示の巻き戻りを防ぐ
        let powerModeDragging = false;  // つまみの操作中。2 秒周期の更新でつまみが戻るのを防ぐ
        let powerModeError = '';
        let powerModeErrTimer = 0;
        // 段階 mode（saver / balanced / best。それ以外は「どれでもない」）に合わせて、ラベルの強調と、
        // スライダーの色（.power-mode.pm-*）・塗りの幅を決める。ドラッグ中の途中経過の表示にも使う。
        function markPowerMode(mode){
            powerRow.querySelectorAll('.pm-labels span').forEach(function(l){
                l.classList.toggle('active', l.dataset.mode === mode);
            });
            POWER_MODES.forEach(function(m){ powerRow.classList.toggle('pm-' + m, m === mode); });
            const i = POWER_MODES.indexOf(mode);
            powerRow.style.setProperty('--pm-fill', i < 0 ? '0%' : (i * 50) + '%');
        }
        function renderPowerMode(pm){
            const show = !!pm;
            if (show !== powerModeShown) {
                powerModeShown = show;
                powerRow.hidden = !show;
                scheduleHeightAdjust();   // 行の出入りで区画の高さが変わる
            }
            if (!pm) return;
            const idx = POWER_MODES.indexOf(pm.active);
            const known = pm.planOK && idx >= 0;
            powerSlider.disabled = !pm.planOK;
            powerSlider.value = idx >= 0 ? idx : 1;
            powerSlider.classList.toggle('pm-none', !known);
            powerRow.classList.toggle('locked', !pm.planOK);
            markPowerMode(known ? pm.active : '');
            let tip = '電源モード: ' + (known ? powerModeNames[pm.active] : '不明');
            if (!pm.planOK) tip = powerPlanLockedTip;
            else if (pm.active === 'other') tip = '電源モード: 不明な電源モードです（どれかを選ぶと切り替わります）';
            if (powerModeError) tip = powerModeError;
            powerSlider.title = tip;
        }
        function updatePowerMode(pm){
            lastPowerMode = pm || null;
            if (!powerModeBusy && !powerModeDragging) renderPowerMode(lastPowerMode);
        }
        function showPowerModeError(msg){
            powerModeError = '切り替えに失敗しました: ' + msg;
            powerRow.classList.add('err');
            clearTimeout(powerModeErrTimer);
            powerModeErrTimer = setTimeout(function(){
                powerModeError = '';
                powerRow.classList.remove('err');
                renderPowerMode(lastPowerMode);
            }, 4000);
        }
        // 指を離した / キーで確定した / クリックしたときに切り替える。
        async function commitPowerMode(mode){
            if (powerModeBusy || !lastPowerMode || !lastPowerMode.planOK) { renderPowerMode(lastPowerMode); return; }
            const prev = lastPowerMode;
            if (prev.active === mode) { renderPowerMode(prev); return; }
            powerModeBusy = true;
            // 操作の結果を先に見せる。失敗したら実際の状態へ戻す。
            renderPowerMode(Object.assign({}, prev, { active: mode }));
            try {
                const res = await apiFetch('/api/powermode?mode=' + encodeURIComponent(mode));
                if (!res.ok) throw new Error((await res.text()).trim() || ('HTTP ' + res.status));
                lastPowerMode = await res.json();
            } catch (err) {
                showPowerModeError(err && err.message ? err.message : String(err));
            } finally {
                powerModeBusy = false;
                renderPowerMode(lastPowerMode);
            }
        }
        // ドラッグ中はラベルの強調だけ追従させる（切り替えは change で行う）
        powerSlider.addEventListener('input', function(){ markPowerMode(POWER_MODES[Number(powerSlider.value)]); });
        powerSlider.addEventListener('change', function(){
            powerModeDragging = false;
            commitPowerMode(POWER_MODES[Number(powerSlider.value)]);
        });
        powerSlider.addEventListener('pointerdown', function(){ powerModeDragging = true; });
        // 同じ位置で離したときは change が来ないので、操作中の印を外す（change は同じイベント処理内で先に走る）
        ['pointerup', 'pointercancel'].forEach(function(t){
            powerSlider.addEventListener(t, function(){ setTimeout(function(){ powerModeDragging = false; if (!powerModeBusy) renderPowerMode(lastPowerMode); }, 0); });
        });
        powerSlider.addEventListener('blur', function(){ powerModeDragging = false; });
        // ラベルのクリックでもその段階へ切り替える
        powerRow.querySelectorAll('.pm-labels span').forEach(function(l){
            l.addEventListener('click', function(e){
                e.stopPropagation();
                if (powerSlider.disabled) return;
                commitPowerMode(l.dataset.mode);
            });
        });

        // 設定は Go 側の config.json に永続化される。フロント側は API 経由で読み書きする。
        // ここで保持する settings オブジェクトは UI 反映のためのキャッシュ。
        const settings = {
            theme: 'system',
            transparent: false,
            // 電源モードの切替機能の ON/OFF（Go 側の config.json の powerModeEnabled。既定 OFF）
            powerMode: false,
            coreBase: 0,
            trayDisplay: 'icon',
            topmost: false,
            viewMode: 0,
            netUnit: 'byte',
            // 拡大率（%）と、選べる拡大率の一覧（Go 側の zoomSteps。起動後に /api/settings の値で上書きされる）
            zoom: 100,
            zoomSteps: [50, 67, 75, 80, 90, 100, 110, 125, 150, 175, 200],
            // Disk 区画の裏面（I/O）の見せ方: 'number' | 'graph'（config.json の diskIoView）
            diskIoView: 'number',
            // 有効なスキンの id（Go 側の config.json の skin。'default' はスキンなし = 現行のデザイン）
            skin: 'default',
            // 非表示状態（Go 側の config.json の hidden と同じ）。true が非表示
            hidden: { cpu: false, memory: false, disk: false, gpu: false, npu: false, network: false, work: true, pomodoro: true, ping: true },
            // 区画の表示順（Go 側の config.json の order と同じ）
            order: ['cpu', 'memory', 'disk', 'gpu', 'npu', 'network', 'ai', 'work', 'pomodoro', 'ping'],
            // 折りたたみ状態（Go 側の config.json の collapsed と同じ）。AI は既定で折りたたみ（D8）
            collapsed: { cpu: false, memory: false, disk: false, gpu: false, npu: false, network: false, ai: true, work: false, pomodoro: false, ping: false },
            // 反転できる区画がいま出している面（Go 側の config.json の flipped と同じ）。true が裏面。
            // 面の正はここで、.flipped クラスは applyFlipped がここから導く。折りたたみ・非表示・データ待ちの間も
            // 面を保ち、再起動しても同じ面に戻すため（クラスを消して表面に戻すことはしない）。
            flipped: { disk: false, network: false, ai: false }
        };

        // Close button (✕): タスクトレイに格納する
        document.getElementById('closeBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            // トレイ格納前に現在の位置・サイズを保存
            apiFetch('/api/persistwindow').finally(() => apiFetch('/api/entertray').catch(()=>{}));
        });

        // Pin button (always-on-top)
        document.getElementById('pinBtn').addEventListener('click', async function(e) {
            e.stopPropagation();
            try {
                const res = await apiFetch('/api/toggletopmost');
                const data = await res.json();
                this.classList.toggle('active', data.topmost);
                settings.topmost = !!data.topmost;
            } catch(err) {}
        });

        // Normal ⇔ Compact のトグル
        let currentViewMode = 0;
        function applyCompactBtn(){
            const btn = document.getElementById('compactBtn');
            if (currentViewMode === 1) {
                btn.textContent = '▢';
                btn.title = 'フル表示';
                btn.classList.add('expanded');
            } else {
                btn.textContent = '▬';
                btn.title = 'コンパクト表示';
                btn.classList.remove('expanded');
            }
        }
        document.getElementById('compactBtn').addEventListener('click', async function(e) {
            e.stopPropagation();
            if (currentViewMode === 0) {
                currentViewMode = 1;
                document.getElementById('dragArea').classList.add('compact');
            } else if (currentViewMode === 1) {
                currentViewMode = 0;
                document.getElementById('dragArea').classList.remove('compact');
            } else {
                return;
            }
            settings.viewMode = currentViewMode;
            applyCompactBtn();
            updateNetValue();
            // 幅と位置の切替は Go 側 (applyViewModeGeometry) が行う。幅が変わるとセクションの
            // 折り返しが変わるので、完了を待ってから自然高さを測り直す。
            await apiFetch('/api/setviewmode?mode=' + currentViewMode).catch(()=>{});
            setTimeout(adjustWindowHeight, 60);
            // 高さ確定後にウィンドウ位置・サイズを config に永続化
            setTimeout(() => apiFetch('/api/persistwindow').catch(()=>{}), 300);
        });

        // ネットワーク部 peak 表示: クリックで B/s ⇔ bps トグル
        // wifi-section のクリック(フリップ)より先に捕まえる必要があるので stopPropagation
        document.getElementById('net-peak').addEventListener('click', function(e){
            e.stopPropagation();
            netUnit = (netUnit === 'byte') ? 'bit' : 'byte';
            settings.netUnit = netUnit;
            apiFetch('/api/setoption?key=netUnit&value=' + netUnit).catch(()=>{});
            refreshNetLegend();
            updateNetValue();
            drawNetGraph();
        });

        // Wi-Fi ⇔ ネットワークグラフ の反転トグル
        // ドラッグとクリックを区別するため、mousedown からの移動量で判定する
        let mouseDownX = 0, mouseDownY = 0, movedSinceDown = false;
        // 表裏の反転（Wi-Fi ⇔ ネットワークグラフ、Disk ⇔ I/O）。区画のどこをクリックしても反転する。
        // name は settings.flipped / config.json の flipped のキー、redraw は裏面のグラフを描く関数。
        // 面を保存するのはこのクリックだけ。折りたたみ・非表示・再起動では面を変えない（applyFlipped を参照）。
        function bindFlip(sec, name, redraw) {
            sec.addEventListener('click', function(e) {
                if (movedSinceDown) return;
                e.stopPropagation();
                const next = !settings.flipped[name];
                settings.flipped[name] = next;
                sec.classList.toggle('flipped', next);
                apiFetch('/api/setoption?key=flip.' + name + '&value=' + next).catch(function(){});
                if (next) {
                    // フリップ直後はキャンバスの clientWidth が 0 のことがあるので
                    // アニメーション完了後も含めて二度描画しておく
                    setTimeout(redraw, 30);
                    setTimeout(redraw, 600);
                }
            });
        }
        const wifiSection = document.getElementById('wifiSection');
        bindFlip(wifiSection, 'network', drawNetGraph);
        const diskSection = document.getElementById('diskSection');
        bindFlip(diskSection, 'disk', redrawDiskGraph);
        // 保存された面を .flipped に反映する。折りたたみや非表示の間は裏面のキャンバスの幅が 0 で描けないので、
        // 展開・表示に戻ったとき（と起動時）は、反転のときと同じく少し置いてグラフを描き直す。
        let graphRedrawTimers = [];
        function scheduleGraphRedraw(){
            graphRedrawTimers.forEach(clearTimeout);
            graphRedrawTimers = [30, 600].map(function(ms){
                return setTimeout(function(){
                    if (settings.flipped.network) drawNetGraph();
                    if (settings.flipped.disk) redrawDiskGraph();
                }, ms);
            });
        }
        // instant: 起動時の復元。回転のアニメーション（0.55 秒）を見せず、最初から保存された面で出す。
        function applyFlipped(instant){
            const cards = [wifiSection, diskSection].map(function(sec){ return sec.querySelector('.flip-card'); });
            if (instant) cards.forEach(function(c){ if (c) c.style.transition = 'none'; });
            wifiSection.classList.toggle('flipped', !!settings.flipped.network);
            diskSection.classList.toggle('flipped', !!settings.flipped.disk);
            if (instant) {
                void wifiSection.offsetWidth;   // 回転後の状態を確定させてから、transition を元に戻す
                cards.forEach(function(c){ if (c) c.style.transition = ''; });
            }
            scheduleGraphRedraw();
        }

        // Drag functionality
        let isDragging = false;
        let isResizing = false;
        let dragReady = false;    // /api/dragstart 完了までは dragmove を送らない
        let resizeReady = false;  // 初期サイズ取得までは resize を送らない
        let resizeDir = '';
        let startCursorX, startCursorY;
        let startWinW = 0, startWinH = 0;
        const dragArea = document.getElementById('dragArea');
        const resizeMargin = 6;

        // mousemove ごとに無制限に fetch するとリクエストが詰まってウィンドウがガタつく。
        // 常に「最新の1件だけ」を in-flight にし、待機中の更新は末尾で1回だけ送る（coalescing）。
        let dragReqInFlight = false, dragPending = false;
        function sendDragMove(){
            if (dragReqInFlight){ dragPending = true; return; }
            dragReqInFlight = true;
            apiFetch('/api/dragmove').catch(()=>{}).finally(()=>{
                dragReqInFlight = false;
                if (dragPending){ dragPending = false; sendDragMove(); }
            });
        }
        let resizeReqInFlight = false, resizePending = null;
        function sendResize(w, h, anchorTop){
            resizePending = { w: w, h: h, anchorTop: anchorTop };
            if (resizeReqInFlight) return;
            resizeReqInFlight = true;
            (function fire(){
                const p = resizePending; resizePending = null;
                let url = '/api/resize?w=' + Math.round(p.w) + '&h=' + Math.round(p.h);
                if (p.anchorTop) url += '&anchor=top';
                apiFetch(url).catch(()=>{}).finally(()=>{
                    if (resizePending){ fire(); } else { resizeReqInFlight = false; }
                });
            })();
        }

        dragArea.addEventListener('mousemove', function(e) {
            if (isDragging || isResizing) return;
            const rect = dragArea.getBoundingClientRect();
            const onRight = (rect.right - e.clientX) <= resizeMargin;
            const onBottom = (rect.bottom - e.clientY) <= resizeMargin;
            if (onRight && onBottom) {
                dragArea.style.cursor = 'nwse-resize';
            } else if (onRight) {
                dragArea.style.cursor = 'ew-resize';
            } else if (onBottom) {
                dragArea.style.cursor = 'ns-resize';
            } else {
                dragArea.style.cursor = 'grab';
            }
        });

        dragArea.addEventListener('mouseleave', function() {
            if (!isDragging && !isResizing) {
                dragArea.style.cursor = 'grab';
            }
        });

        dragArea.addEventListener('mousedown', async function(e) {
            mouseDownX = e.screenX;
            mouseDownY = e.screenY;
            movedSinceDown = false;
            if (e.target.id === 'closeBtn' || e.target.closest('.chev, .ai-act, .ai-refresh, .power-mode, .wk-btn, .wk-nudge, .wk-start, .wk-time, .pm-btn')) return;
            const rect = dragArea.getBoundingClientRect();
            const onRight = (rect.right - e.clientX) <= resizeMargin;
            const onBottom = (rect.bottom - e.clientY) <= resizeMargin;
            if (onRight || onBottom) {
                isResizing = true;
                resizeReady = false;
                resizeDir = (onRight ? 'r' : '') + (onBottom ? 'b' : '');
                dragArea.classList.add('resizing');
                startCursorX = e.screenX;
                startCursorY = e.screenY;
                try {
                    const res = await apiFetch('/api/windowsize');
                    const data = await res.json();
                    startWinW = data.width;
                    startWinH = data.height;
                    resizeReady = true;  // 初期サイズ確定後のみ resize を送る
                } catch(err) {
                    isResizing = false;
                    dragArea.classList.remove('resizing');
                }
                e.preventDefault();
                return;
            }
            isDragging = true;
            dragReady = false;
            dragArea.classList.add('dragging');
            // dragstart で基準座標を記録し終えるまで dragmove を送らない
            // (未 await のまま dragmove が走ると誤った基準でウィンドウが飛ぶ)
            apiFetch('/api/dragstart')
                .then(()=>{ dragReady = true; })
                .catch(()=>{ isDragging = false; dragArea.classList.remove('dragging'); });
        });

        document.addEventListener('mousemove', function(e) {
            if (!movedSinceDown) {
                const dx = Math.abs(e.screenX - mouseDownX);
                const dy = Math.abs(e.screenY - mouseDownY);
                if (dx > 3 || dy > 3) movedSinceDown = true;
            }
            if (isResizing) {
                if (!resizeReady) return;
                // screenX は DPI 換算の値でズームを含まない。サイズ（レイアウト px）に足すときは、
                // ズーム率で割って単位を揃える（割らないと、拡大中はカーソルより速く広がる）。
                const zoomRatio = (settings.zoom || 100) / 100;
                const dx = (e.screenX - startCursorX) / zoomRatio;
                const dy = (e.screenY - startCursorY) / zoomRatio;
                let newW = startWinW;
                let newH = startWinH;
                if (resizeDir.indexOf('r') !== -1) {
                    newW = startWinW + dx;
                }
                if (resizeDir.indexOf('b') !== -1) {
                    newH = startWinH + dy;
                }
                // 下端を掴んだリサイズは上端を固定して下方向に伸ばす
                // (anchor=top)。掴んだエッジとカーソルが乖離しないようにする。
                sendResize(newW, newH, resizeDir.indexOf('b') !== -1);
                return;
            }
            if (!isDragging || !dragReady) return;
            sendDragMove();
        });

        document.addEventListener('mouseup', function() {
            const wasDragging = isDragging;
            const wasResizing = isResizing;
            if (isResizing) {
                isResizing = false;
                dragArea.classList.remove('resizing');
            }
            isDragging = false;
            dragArea.classList.remove('dragging');
            if (wasDragging || wasResizing) {
                apiFetch('/api/persistwindow').catch(()=>{});
            }
        });

        function adjustWindowHeight() {
            // height:100% / overflow:hidden の影響を避けるため
            // 一時的に auto にしてコンテンツの自然な高さを測定する
            updateLastSection();
            const el = document.documentElement;
            const bd = document.body;
            const ct = document.getElementById('dragArea');
            el.style.height = 'auto'; bd.style.height = 'auto'; ct.style.height = 'auto';
            let h = ct.scrollHeight;
            el.style.height = '100%'; bd.style.height = '100%'; ct.style.height = '100%';
            return apiFetch('/api/resize?h=' + h).catch(()=>{});
        }

        // ネットワーク履歴（直近 N サンプル分のスループット）
        const netHistory = [];
        const netMaxSamples = 60;
        // 単位モード: 'byte' は B/s・KB/s・MB/s (1024 基準)、'bit' は bps・Kbps・Mbps (1000 基準)
        // 初期値は 'byte'。/api/settings 取得後に Go 側の値で上書きされる。
        let netUnit = 'byte';
        function formatRate(bytesPerSec){
            // 単位は固定: byte モードは常に KB/s、bit モードは常に Mbps。
            // 値域に応じて小数桁数だけ調整する。
            function withDecimals(v){
                if (v >= 100) return v.toFixed(0);
                if (v >= 10)  return v.toFixed(1);
                return v.toFixed(2);
            }
            if (netUnit === 'bit'){
                const mbps = bytesPerSec * 8 / 1000000;
                return withDecimals(mbps) + ' Mbps';
            }
            const kbs = bytesPerSec / 1024;
            return withDecimals(kbs) + ' KB/s';
        }
        function refreshNetLegend(){
            if (netHistory.length === 0) return;
            const last = netHistory[netHistory.length - 1];
            document.getElementById('net-rx-val').textContent = formatRate(last.rx);
            document.getElementById('net-tx-val').textContent = formatRate(last.tx);
        }
        // net-peak の中身はモードで変える。
        // フル表示: グラフの縦軸スケールとしての直近 60 サンプルのピーク。現在値は
        //           グラフ下の凡例 (↓rx ↑tx) が出す。
        // コンパクト表示 / Wi-Fi 区画の折りたたみ中: グラフも凡例も隠れるので、現在の合計スループット (rx+tx)。
        // 表示中のレイアウトと必ず一致させるため、判定は class を直接見る。
        // 履歴中の最大スループット (rx / tx の大きい方)。
        // グラフの縦軸スケールと、フル表示の net-peak 表示の両方が使う。
        function netPeak(){
            let peak = 0;
            for (const p of netHistory){
                if (p.rx > peak) peak = p.rx;
                if (p.tx > peak) peak = p.tx;
            }
            return peak;
        }
        function updateNetValue(){
            if (netHistory.length === 0) return;
            const el = document.getElementById('net-peak');
            const unitHint = ' / クリックで単位切替 (B ⇔ bit)';
            // 折りたたみ中もグラフ・凡例は隠れるので、コンパクト表示と同じく合計スループットを出す
            if (document.getElementById('dragArea').classList.contains('compact')
                || document.getElementById('wifiSection').classList.contains('collapsed')){
                const last = netHistory[netHistory.length - 1];
                el.textContent = formatRate(last.rx + last.tx);
                el.title = '現在の合計スループット (↓+↑)' + unitHint;
                return;
            }
            if (netHistory.length < 2) return;
            el.textContent = formatRate(netPeak());
            el.title = 'グラフのピーク (直近 2 分)' + unitHint;
        }
        function drawNetGraph(){
            // 最低スケール 8KB/s — 無通信時に線がベタ貼り付きにならないように
            drawRateGraph('netCanvas', netHistory, p => p.rx, p => p.tx, 8*1024);
        }
        // 2 系列（Network は受信 / 送信、Disk は読み取り / 書き込み）のスループットの折れ線。
        // 色は --net-rx / --net-tx を使う（Disk の読み取りが受信側、書き込みが送信側の色）。
        function drawRateGraph(canvasId, history, getA, getB, minScale){
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            // 内部解像度を CSS サイズに合わせる（DPI スケール込み）
            const dpr = window.devicePixelRatio || 1;
            const cssW = canvas.clientWidth;
            const cssH = canvas.clientHeight;
            if (cssW === 0 || cssH === 0) return;
            if (canvas.width !== Math.round(cssW*dpr) || canvas.height !== Math.round(cssH*dpr)){
                canvas.width = Math.round(cssW*dpr);
                canvas.height = Math.round(cssH*dpr);
            }
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            // 色は CSS 変数（--net-*）から読む。ライトテーマでダーク固定色（白文字・淡い蛍光色）が
            // 見えない問題と、スキンによる差し替えの両方を、変数で吸収する。
            // 読めない・色として不正なときは、スキン導入前の直書き値に戻す。
            const light = document.body.classList.contains('theme-light');
            const bodyStyle = getComputedStyle(document.body);
            function cssColor(name, fallback){
                const v = bodyStyle.getPropertyValue(name).trim();
                return (v && CSS.supports('color', v)) ? v : fallback;
            }
            if (history.length < 2){
                ctx.fillStyle = cssColor('--net-empty-color', light ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.35)');
                ctx.font = '10px Segoe UI';
                ctx.fillText('計測中...', 6, cssH/2);
                return;
            }
            // 縦軸は履歴中の最大値。最低スケール minScale を設けて、ほぼ無通信のときに線が上下に振れすぎないようにする
            let peak = 0;
            for (const p of history){
                peak = Math.max(peak, getA(p), getB(p));
            }
            const scale = Math.max(peak, minScale);
            const step = cssW / (netMaxSamples - 1);
            const offset = netMaxSamples - history.length;
            function drawSeries(getVal, fill, stroke){
                ctx.fillStyle = fill;
                ctx.beginPath();
                ctx.moveTo((offset) * step, cssH);
                history.forEach((p, i) => {
                    const x = (offset + i) * step;
                    const y = cssH - (getVal(p) / scale) * cssH;
                    ctx.lineTo(x, y);
                });
                ctx.lineTo((offset + history.length - 1) * step, cssH);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                history.forEach((p, i) => {
                    const x = (offset + i) * step;
                    const y = cssH - (getVal(p) / scale) * cssH;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }
            drawSeries(getA,
                cssColor('--net-rx-fill', light ? 'rgba(26,168,107,0.20)' : 'rgba(127,255,170,0.25)'),
                cssColor('--net-rx', light ? '#1aa86b' : '#7fffaa'));
            drawSeries(getB,
                cssColor('--net-tx-fill', light ? 'rgba(183,77,166,0.18)' : 'rgba(255,163,255,0.22)'),
                cssColor('--net-tx', light ? '#b74da6' : '#ffa3ff'));
        }

        // ============ 設定モーダルと初期化 ============
        const systemThemeMql = window.matchMedia('(prefers-color-scheme: light)');
        function applyTheme(){
            let effective = settings.theme;
            if (effective === 'system') effective = systemThemeMql.matches ? 'light' : 'dark';
            document.body.classList.toggle('theme-light', effective === 'light');
            // グラフの色は変数で決まるので、反転中ならテーマの切替に合わせて描き直す
            if (wifiSection.classList.contains('flipped')) drawNetGraph();
            redrawDiskGraph();
        }
        systemThemeMql.addEventListener('change', () => { if (settings.theme === 'system') applyTheme(); });

        // ============ スキン ============
        // 有効なスキンは body の data-skin と、<style id="skin-css"> に注入した CSS で表す。
        // CSP が style-src 'unsafe-inline' のみで <link> は使えないため、CSS は fetch して textContent に入れる。
        // 'default' は属性も <style> も持たない（現行のデザイン）。
        let skinGen = 0;               // 世代番号。連続した適用で、古い応答が後から勝たないようにする
        let skinApplied = 'default';   // 実際に適用済みのスキン（取得に失敗したときは 'default'）
        let skinLatest = Promise.resolve();
        const SKIN_FETCH_TIMEOUT_MS = 2000;
        // id のスキンを適用する。取得に失敗したら 'default' で続行する。
        // 返す Promise は、適用と高さの再調整が済んだ時点で解決する（起動時の /api/ready を待たせるため）。
        function applySkin(id){
            const gen = ++skinGen;
            skinLatest = (async function(){
                let css = '';
                if (id !== 'default') {
                    // 応答が返らなくても初回の /api/ready を止めないよう、本文の読取までを有限の期限に収める
                    // （Go 側の表示フォールバック 3 秒より短くする）。期限切れは default のフォールバックへ流す。
                    const ctl = new AbortController();
                    const timer = setTimeout(function(){ ctl.abort(); }, SKIN_FETCH_TIMEOUT_MS);
                    try {
                        const res = await apiFetch('/api/skin/css?id=' + encodeURIComponent(id), { signal: ctl.signal });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        css = await res.text();
                    } catch (e) {
                        console.warn('Skin load failed:', id, e);
                        id = 'default';
                    } finally {
                        clearTimeout(timer);
                    }
                }
                // 後から新しい適用が始まっていたら、この応答は捨てて最新の完了を待つ
                if (gen !== skinGen) return skinLatest;
                const wasDefault = skinApplied === 'default';
                let style = document.getElementById('skin-css');
                if (id === 'default') {
                    if (style) style.remove();
                    document.body.removeAttribute('data-skin');
                } else {
                    if (!style) { style = document.createElement('style'); style.id = 'skin-css'; }
                    // skin.css は body.theme-light と同じ詳細度のセレクタで書かれているので、
                    // <head> の最後に置いて、順序で本体のルールに勝たせる
                    style.textContent = css;
                    if (document.head.lastElementChild !== style) document.head.appendChild(style);
                    document.body.setAttribute('data-skin', id);
                }
                skinApplied = id;
                // default のままなら何も変わっていない。それ以外は、CSS が同じでも描き直す
                if (id === 'default' && wasDefault) return;
                drawNetGraph();
                redrawDiskGraph();
                await adjustWindowHeight();
            })();
            return skinLatest;
        }

        function applyCoreBase(){
            document.querySelectorAll('.core-label[data-core-index]').forEach(el => {
                const i = Number(el.dataset.coreIndex);
                el.textContent = 'Core ' + (i + settings.coreBase);
            });
        }

        // ============ 区画の表示/非表示 ============
        // CPU / メモリ / Disk / Wi-Fi は .is-hidden で隠す。GPU / NPU はデバイスの有無でも出し分けるので
        // applyAccelData が settings.hidden を見て表示を決める。Disk は取得できないときの出し分けを applyDiskData が持つ。
        const hideableSections = { cpu: 'cpu', memory: 'memory', disk: 'disk', network: 'wifiSection', work: 'work', pomodoro: 'pomodoro', ping: 'ping' };
        function updateLastSection(){
            // 最後に見えている区画だけ下余白を 0 にする（:last-child は非表示の区画も数えてしまう）
            const secs = Array.from(document.querySelectorAll('#dragArea > .section')).filter(function(el){
                return getComputedStyle(el).display !== 'none';
            });
            document.querySelectorAll('#dragArea > .section').forEach(function(el){ el.classList.remove('last-visible'); });
            if (secs.length) secs[secs.length - 1].classList.add('last-visible');
        }
        function applyHidden(){
            Object.keys(hideableSections).forEach(function(n){
                const id = hideableSections[n];
                const el = n === 'network' ? document.getElementById(id) : document.querySelector('.section[data-sec="' + id + '"]');
                if (!el) return;
                el.classList.toggle('is-hidden', !!settings.hidden[n]);
                // 非表示の間も、いま出している面（settings.flipped）は変えない。表示に戻したら同じ面から再開する
            });
            applyAccelData(lastGPU, lastNPU);
            applyDiskData(lastDisk);
            updateLastSection();
            scheduleGraphRedraw();
        }
        // ============ 区画の表示順 ============
        function applyOrder(){
            const area = document.getElementById('dragArea');
            // appendChild は既存の要素を移動する。区画は #dragArea の末尾にまとまっているので、順に付け直せばよい
            settings.order.forEach(function(n){
                const el = area.querySelector(':scope > .section[data-sec="' + n + '"]');
                if (el) area.appendChild(el);
            });
            updateLastSection();
        }
        // 設定は別ウィンドウ（/settings）で開く。変更は /api/settingschanged 経由で
        // window.__settingsChanged に届き、applyServerSettings で反映する。
        document.getElementById('settingsBtn').addEventListener('click', function(e){
            e.stopPropagation();
            apiFetch('/api/opensettings').catch(function(){});
        });

        // ============ 区画の折りたたみ（D10）============
        // 開閉は各見出しのシェブロン（▼）のクリックだけ。Wi-Fi は区画のどこをクリックしても表裏が
        // 反転するため、見出し全体のクリックにはしない。状態は Go 側の config.json に保存される。
        const collapsibleSections = ['cpu', 'memory', 'disk', 'gpu', 'npu', 'network', 'ai', 'work', 'pomodoro', 'ping'];
        function applyCollapsed(){
            collapsibleSections.forEach(function(n){
                const el = document.querySelector('.section[data-sec="' + n + '"]');
                if (!el) return;
                const c = !!(settings.collapsed && settings.collapsed[n]);
                el.classList.toggle('collapsed', c);
                el.querySelectorAll('.chev').forEach(function(b){ b.title = c ? '展開' : '折りたたむ'; });
                // Wi-Fi と Disk は、折りたたんでも展開しても、いま出している面（settings.flipped）を保つ。
                // 折りたたみ中の裏面は見出し 1 行（CSS の .collapsed 側）で、展開すると同じ面のグラフに戻る。
            });
            // net-peak の中身は折りたたみ状態でも変わるので、次の周期を待たずに付け替える
            updateNetValue();
            // 展開した裏面のグラフは、折りたたみ中は描けていない（canvas が非表示）ので描き直す
            scheduleGraphRedraw();
        }
        let heightTimer = 0;
        function scheduleHeightAdjust(){
            clearTimeout(heightTimer);
            heightTimer = setTimeout(adjustWindowHeight, 40);
        }
        document.querySelectorAll('.chev').forEach(function(b){
            // 区画（Wi-Fi の反転）やドラッグ開始へ伝えない
            b.addEventListener('click', function(e){
                e.stopPropagation();
                const n = b.dataset.sec;
                settings.collapsed[n] = !settings.collapsed[n];
                apiFetch('/api/setoption?key=collapse.' + n + '&value=' + (settings.collapsed[n] ? 'true' : 'false')).catch(function(){});
                applyCollapsed();
                scheduleHeightAdjust();
                setTimeout(function(){ apiFetch('/api/persistwindow').catch(function(){}); }, 300);
            });
        });

        const workHooks = { heightChanged: scheduleHeightAdjust };
        let workSettingsKey = '';
        let pomoSettingsKey = '';
        // コンパクト表示（幅 130px）では勤務時間の入力欄を置けないので、区画のクリックで、入力用の小さな別ウィンドウを開く。
        // ドラッグとは区別する（bindFlip と同じく movedSinceDown を見る）。フル表示では何もしない（区画の中で操作できる）。
        document.getElementById('workSection').addEventListener('click', function(){
            if (movedSinceDown || !document.getElementById('dragArea').classList.contains('compact')) return;
            apiFetch('/api/openworktimer').catch(function(){});
        });
        __WORK_JS__
        // ============ ポモドーロ ============
        // 区間の計算・切り替え・集中モードは Go 側（pomodoro.go）。ここは描画と操作だけ。
        // 残り時間は、応答の endsAtMs（期限の Unix ミリ秒）から 1 秒ごとに手元で数える
        // （2 秒周期の /api/system だけだと、数字が 2 秒刻みで飛ぶ）。周期の応答で補正される。
        let lastPomo = null;
        let pomoErrTimer = 0;
        let pomoLayoutKey = '';
        let pomoPolledAt = 0;
        function fmtPomo(sec){ sec = Math.max(0, sec); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
        function pomoRemaining(info){
            return info.running && info.endsAtMs ? Math.max(0, Math.ceil((info.endsAtMs - Date.now()) / 1000)) : info.remainingSec;
        }
        function pomoClass(info){
            if (info.phase === 'idle') return 'idle';
            if (info.paused) return 'paused';
            return info.phase === 'focus' ? '' : 'break';
        }
        function showPomoErr(msg){
            const el = document.getElementById('pomo-err');
            el.textContent = msg; el.hidden = !msg;
            clearTimeout(pomoErrTimer);
            if (msg) pomoErrTimer = setTimeout(function(){ showPomoErr(''); }, 4000);
            scheduleHeightAdjust();
        }
        // 時間だけを描く（1 秒ごと）
        function renderPomoTime(){
            if (!lastPomo || settings.hidden.pomodoro) return;
            const info = lastPomo;
            const rem = pomoRemaining(info);
            const text = info.phase === 'idle' ? fmtPomo(info.totalSec) : fmtPomo(rem);
            document.getElementById('pomo-head').textContent = text;
            document.getElementById('pomo-big').textContent = text;
            const pct = info.phase === 'idle' || !info.totalSec ? 0 : Math.min(100, Math.max(0, (1 - rem / info.totalSec) * 100));
            document.getElementById('pomo-bar').style.width = pct + '%';
            // 期限に届いたら、次の周期を待たずに、Go 側が進めた区間を取りに行く（連打しない）
            if (info.running && rem === 0 && Date.now() - pomoPolledAt > 1500) pomoRefresh();
        }
        function pomoRefresh(){
            pomoPolledAt = Date.now();
            apiFetch('/api/system').then(function(r){ return r.json(); }).then(function(d){ applyPomodoro(d.Pomodoro); }).catch(function(){});
        }
        function applyPomodoro(info){
            if (!info) return;   // 非表示のときは null。区画は applyHidden が隠す
            lastPomo = info;
            const cls = pomoClass(info);
            const names = { idle: '未開始', focus: '集中', short: '休憩', long: '長い休憩' };
            document.getElementById('pomo-head').className = 'section-value ' + cls;
            document.getElementById('pomo-big').className = 'pm-big ' + cls;
            document.getElementById('pomo-bar').className = 'progress-fill pomo-fill ' + cls;
            let cap = names[info.phase] || '';
            if (info.paused && info.phase !== 'idle') cap += '（一時停止中）';
            document.getElementById('pomo-cap').textContent = cap;
            document.getElementById('pomo-mark').hidden = !info.focusActive;
            // 4 回のうちの何回目か: ● 終えた回、◉ 集中中の回、○ これから
            const done = info.phase === 'idle' ? 0 : (info.phase === 'focus' ? info.round - 1 : info.round);
            let dots = '';
            for (let i = 1; i <= info.longEvery; i++) dots += (i <= done ? '●' : (info.phase === 'focus' && i === info.round ? '◉' : '○')) + (i < info.longEvery ? ' ' : '');
            document.getElementById('pomo-dots').textContent = dots;
            document.getElementById('pomo-done').textContent = info.doneToday + ' 回';
            const chip = document.getElementById('pomo-chip');
            if (info.focusActive) { chip.textContent = '🔒 集中モード: 対象のアプリを隠しています'; chip.hidden = false; }
            else if (info.revealed) { chip.textContent = '👁 この区間は、対象のアプリを隠しません'; chip.hidden = false; }
            else if (info.paused && info.phase !== 'idle' && !info.autoNext && info.remainingSec === info.totalSec) { chip.textContent = '⏸ 次の区間の開始待ち'; chip.hidden = false; }
            else chip.hidden = true;
            const idle = info.phase === 'idle';
            document.getElementById('pomo-btn-start').hidden = !idle;
            document.getElementById('pomo-btn-pause').hidden = !info.running;
            document.getElementById('pomo-btn-resume').hidden = !(info.paused && !idle);
            document.getElementById('pomo-btn-skip').hidden = idle;
            document.getElementById('pomo-btn-reset').hidden = idle;
            const reveal = info.phase === 'focus' && info.running && info.focusMode;
            document.getElementById('pomo-reveal-row').hidden = !reveal;
            document.getElementById('pomo-btn-reveal').textContent = info.revealed ? '再び隠す' : '一時的に表示';
            document.getElementById('pomo-btn-reveal').dataset.pm = info.revealed ? 'conceal' : 'reveal';
            renderPomoTime();
            // 行の増減で高さが変わるので、構成が変わったときだけ測り直す
            const key = [info.phase, info.running, info.paused, info.focusActive, info.revealed, !chip.hidden, reveal].join('|');
            if (key !== pomoLayoutKey) {
                const first = pomoLayoutKey === '';
                pomoLayoutKey = key;
                if (!first) scheduleHeightAdjust();
            }
        }
        // 操作は POST。応答は操作後のスナップショットなので、次の周期を待たずに描く。
        async function pomoAction(action){
            try {
                const res = await apiFetch('/api/pomodoro?action=' + action, { method: 'POST' });
                if (!res.ok) { showPomoErr((await res.text()).trim()); return false; }
                showPomoErr('');
                applyPomodoro(await res.json());
                return true;
            } catch (e) { showPomoErr('通信に失敗しました'); return false; }
        }
        document.getElementById('pomoSection').addEventListener('click', function(e){
            const t = e.target.closest('[data-pm]');
            if (t) { e.stopPropagation(); pomoAction(t.dataset.pm); return; }
            // コンパクト表示（見出し 1 行）は、区画のクリックで 開始 / 一時停止 / 再開。ドラッグとは区別する。
            if (movedSinceDown || !document.getElementById('dragArea').classList.contains('compact') || !lastPomo) return;
            e.stopPropagation();
            pomoAction(lastPomo.phase === 'idle' ? 'start' : (lastPomo.running ? 'pause' : 'resume'));
        });
        setInterval(renderPomoTime, 1000);

        // ============ Ping 監視 ============
        let pingLayoutKey = '';
        // 行の増減で高さが変わるので、構成が変わったとき（最初の描画も含む）に測り直す
        function pingRelayout(key){
            if (key === pingLayoutKey) return;
            pingLayoutKey = key;
            scheduleHeightAdjust();
        }
        // 警告として数える status（ping.IsAlertStatus と合わせる）
        const PING_ALERT_STATUS = { warn: true, error: true, unresolved: true };
        // RTT の表示。ICMP の応答は ms 単位の整数なので、0 は 1ms 未満
        function pingRttText(ms){ return ms === 0 ? '<1 ms' : ms + ' ms'; }
        function applyPing(info){
            const sec = document.getElementById('pingSection');
            if (!sec) return;
            const head = document.getElementById('ping-head');
            const list = document.getElementById('ping-list');
            if (!head || !list) return;
            const targets = (info && info.targets) || [];
            if (targets.length === 0) {
                // 非表示のとき・監視先がないとき。古い行や値を残さない
                if (pingLayoutKey !== 'empty') {
                    head.classList.remove('danger');
                    head.textContent = '-- ms';
                    list.innerHTML = '';
                    const empty = document.createElement('div');
                    empty.className = 'ping-empty';
                    empty.textContent = '監視先が未登録です（⚙ の「疎通」で追加）';
                    list.appendChild(empty);
                    pingRelayout('empty');
                }
                return;
            }
            // 見出しは、警告があるときは件数、ないときは代表 RTT（最悪値）。警告かどうかは Go 側の status だけで決める
            const warnCount = targets.filter(function(t){ return PING_ALERT_STATUS[t.status] === true; }).length;
            if (warnCount > 0) {
                head.classList.add('danger');
                head.textContent = '⚠ ' + warnCount + ' 件';
            } else {
                head.classList.remove('danger');
                head.textContent = info.summaryRtt >= 0 ? pingRttText(info.summaryRtt) : '-- ms';
            }
            list.innerHTML = '';
            targets.forEach(function(t){
                const row = document.createElement('div');
                row.className = 'ping-row';
                row.title = t.targetIP ? (t.host + ' (' + t.targetIP + ')') : t.host;
                if (t.resolveFail) row.title += ' — 名前解決に失敗';

                const hostSpan = document.createElement('span');
                hostSpan.className = 'ping-host';
                hostSpan.textContent = t.host;
                row.appendChild(hostSpan);

                // RTT は直近の 1 回の値。失敗したとき（ロス・名前解決の失敗）は Go 側が -1 にする
                const rttSpan = document.createElement('span');
                rttSpan.className = t.isWarnRTT ? 'ping-rtt danger' : 'ping-rtt';
                rttSpan.textContent = t.rttMs >= 0 ? pingRttText(t.rttMs) : '--';
                row.appendChild(rttSpan);

                // ロスは「窓内の失敗回数/サンプル数」。立ち上がりでサンプルが少ない間は --。
                // 名前解決が続けて失敗しているときは、ロスとは別に「解決失敗」と出す
                const lossSpan = document.createElement('span');
                const unresolved = t.status === 'unresolved';
                const lossDanger = unresolved || t.isWarnLoss || t.status === 'error';
                lossSpan.className = lossDanger ? 'ping-loss danger' : 'ping-loss';
                lossSpan.textContent = unresolved ? '解決失敗' : (t.lossReady ? t.lossCount + '/' + t.sentCount : '--');
                row.appendChild(lossSpan);

                list.appendChild(row);
            });
            pingRelayout('rows' + targets.length);
        }

        // ============ AI 使用量（Claude / Codex）============
        const ai = { settings: null, usage: null, status: null, html: '', sum: '', comp: '', timer: 0, statusTimer: 0, rotateTimer: 0, rotateMs: 0 };
        const AI_PROVIDERS = [
            { id: 'claude', name: 'Claude', letter: 'C', cls: 'claude', flag: 'claudeEnabled' },
            { id: 'codex',  name: 'Codex',  letter: 'X', cls: 'codex',  flag: 'codexEnabled' }
        ];
        const JP_WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
        // 外部（サービス側）由来の文字列は必ずエスケープして埋め込む
        function aiEsc(s){
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        // 0-60% は既定色、61-80% は黄、81-100% は赤（ClaudeMonitor と同じ閾値）
        function aiBand(p){ return p >= 81 ? 'crit' : (p >= 61 ? 'warn' : ''); }
        // 一度も取得できていない窓（0% で ResetsAt 無し）は null
        function aiPct(w){
            if (!w || typeof w.utilization !== 'number' || (w.utilization === 0 && !w.resetsAt)) return null;
            return Math.max(0, Math.min(100, Math.round(w.utilization)));
        }
        function aiShortLabel(l){ return l === '5時間' ? '5h' : (l === '7日' ? '7d' : l); }
        function aiResetText(iso, relative){
            if (!iso) return '';
            const t = new Date(iso);
            if (isNaN(t.getTime())) return '';
            if (relative) {
                const diffMin = Math.round((t.getTime() - Date.now()) / 60000);
                if (diffMin <= 0) return '↻ まもなくリセット';
                const h = Math.floor(diffMin / 60), m = diffMin % 60;
                return h <= 0 ? '↻ あと' + m + '分' : '↻ あと' + h + '時間' + m + '分';
            }
            const pad = function(n){ return String(n).padStart(2, '0'); };
            return '↻ ' + (t.getMonth() + 1) + '月' + t.getDate() + '日（' + JP_WEEKDAYS[t.getDay()] + '）' + pad(t.getHours()) + ':' + pad(t.getMinutes());
        }
        // 表示する窓: ラベルのあるものだけ。まだ取得できていないときは 5h / 7d の枠だけ出す。
        function aiWindows(u){
            const out = [];
            if (u.fiveHour && u.fiveHour.label) out.push({ key: 'five', label: aiShortLabel(u.fiveHour.label), win: u.fiveHour });
            if (u.sevenDay && u.sevenDay.label) out.push({ key: 'seven', label: aiShortLabel(u.sevenDay.label), win: u.sevenDay });
            if (out.length === 0) return [{ key: 'five', label: '5h', win: null }, { key: 'seven', label: '7d', win: null }];
            return out;
        }
        function aiPrimaryPct(u){
            const f = aiPct(u.fiveHour);
            return f !== null ? f : aiPct(u.sevenDay);
        }
        // サービス障害の表示。個別の構成要素名（status ページ側で変わりうる）ではなく、
        // 進行中のインシデントと、障害を示す構成要素の有無で判断する。
        function aiStatusOf(st){
            if (!st || !st.fetchedAt) return { label: '', cls: '', incident: '' };
            const bad = ['degraded_performance', 'partial_outage', 'major_outage'];
            const incs = st.incidents || [];
            const svcBad = (st.services || []).some(function(s){ return bad.indexOf(s.status) !== -1; });
            if (incs.length || svcBad) {
                let t = incs.length ? (incs[0].name || '') : '';
                if (incs.length > 1) t += ' ほか ' + (incs.length - 1) + ' 件';
                return { label: '障害', cls: 'inc', incident: t || 'サービスに問題が出ています' };
            }
            return { label: '稼働中', cls: 'ok', incident: '' };
        }
        function aiProviderHtml(p, u, st){
            const si = aiStatusOf(st);
            const relative = !!(ai.settings && ai.settings.resetTimeFormat === 'relative');
            const plan = (u.subscriptionType || '').replace(/^(Claude|ChatGPT)\s+/, '');
            let h = '<div class="prov-head"><span class="prov-name" data-ai-open="usage" data-provider="' + p.id + '" title="使用量ページを開く"><i></i>' + p.name + '</span>';
            if (plan && u.authState === 'ok') h += '<span class="plan">' + aiEsc(plan) + '</span>';
            if (si.label) h += '<span class="prov-state ' + si.cls + '" data-ai-open="status" data-provider="' + p.id + '" title="ステータスページを開く">' + si.label + '</span>';
            h += '</div>';
            if (si.incident) h += '<div class="chip warn" data-ai-open="status" data-provider="' + p.id + '">⚠ ' + aiEsc(si.incident) + '</div>';
            if (u.authState === 'needs_login') {
                h += '<div class="chip login">未ログイン<button class="ai-act" data-ai-login="' + p.id + '">ログイン</button></div>';
            } else if (u.authState === 'network_error') {
                h += '<div class="chip warn" style="cursor:default">取得失敗: ' + aiEsc(u.lastError || '') + '</div>';
            } else if (!u.authState || u.authState === 'init') {
                h += '<div class="chip info">取得中…</div>';
            }
            aiWindows(u).forEach(function(w){
                const pct = aiPct(w.win);
                const b = pct === null ? '' : aiBand(pct);
                h += '<div class="wrow"><span class="lab">' + aiEsc(w.label) + '</span><div class="progress-bar"><div class="progress-fill ' + b + '" style="width:' + (pct === null ? 0 : pct) + '%"></div></div><span class="pct ' + (pct === null ? 'na' : b) + '">' + (pct === null ? '—' : pct + '%') + '</span></div>';
                if (pct !== null) {
                    const txt = aiResetText(w.win.resetsAt, relative && w.key === 'five');
                    if (txt) h += '<div class="wreset">' + aiEsc(txt) + '</div>';
                }
            });
            const ov = u.overage;
            if (typeof u.creditBalance === 'number') {
                h += '<div class="extra"><span>クレジット残高</span><span>' + Math.round(u.creditBalance).toLocaleString('ja-JP') + ' credits</span></div>';
            } else if (ov && typeof ov.amountUsed === 'number' && !(ov.amountUsed === 0 && ov.spendingLimit == null)) {
                const lim = (ov.spendingLimit != null && ov.spendingLimit > 0) ? ' / $' + ov.spendingLimit.toFixed(2) : '（上限なし）';
                h += '<div class="extra"><span>追加利用枠</span><span>$' + ov.amountUsed.toFixed(2) + lim + '</span></div>';
            }
            return h;
        }
        // 折りたたみ時・コンパクト時用。プロバイダごとに 1 行。状態は記号ではなく短い語で出す
        // （? や … では何が起きているか分からないため）。
        function aiCompactHtml(){
            const s = ai.settings, u = ai.usage || {};
            if (!s) return '';
            return AI_PROVIDERS.filter(function(p){ return s[p.flag]; }).map(function(p){
                const x = u[p.id] || {};
                let cls = 'na', val;
                if (x.authState === 'needs_login') val = '未ログイン';
                else if (x.authState === 'network_error') val = '取得失敗';
                else if (!x.authState || x.authState === 'init') val = '取得中';
                else {
                    const pc = aiPrimaryPct(x);
                    if (pc === null) val = '—';
                    else { cls = aiBand(pc); val = pc + '%'; }
                }
                return '<div class="ai-crow ' + p.cls + '"><i></i><span class="ai-cname">' + p.name +
                       '</span><span class="ai-cval ' + cls + '">' + val + '</span></div>';
            }).join('');
        }
        function renderAI(){
            const s = ai.settings;
            if (!s || !s.enabled) return;
            const u = ai.usage || {};
            const html = AI_PROVIDERS.filter(function(p){ return s[p.flag]; }).map(function(p){
                return '<div class="prov ' + p.cls + '">' + aiProviderHtml(p, u[p.id] || {}, ai.status && ai.status[p.id]) + '</div>';
            }).join('');
            const comp = aiCompactHtml();
            if (html !== ai.html) {
                document.getElementById('ai-body').innerHTML = html;
                ai.html = html;
                scheduleHeightAdjust();
            }
            if (comp !== ai.comp) {
                document.getElementById('ai-compact').innerHTML = comp;
                ai.comp = comp;
                scheduleHeightAdjust();
            }
            applyAICompactDisplay();
        }
        // 折りたたみ / コンパクト表示の見せ方。"rotate"（自動）と "click"（クリック）は 2 行を重ねて、
        // それぞれ一定間隔 / クリックで反転させる。
        // 行が 1 つだけのときは入れ替える相手がいないので、反転させず普通に出す。
        // 自動で反転する間隔は設定（ai.compactRotateSeconds。Go 側が 2〜60 秒に矯正済み）。取れないときは従来の 4 秒。
        const AI_ROTATE_DEFAULT_MS = 4000;
        function aiRotateMs(){
            const sec = ai.settings ? Number(ai.settings.compactRotateSeconds) : 0;
            return sec > 0 ? sec * 1000 : AI_ROTATE_DEFAULT_MS;
        }
        function applyAICompactDisplay(){
            const box = document.getElementById('ai-compact');
            const mode = ai.settings && ai.settings.enabled ? ai.settings.compactDisplay : '';
            const flippable = (mode === 'rotate' || mode === 'click') && box.children.length >= 2;
            const rotate = flippable;          // 重ねて反転させるレイアウトか
            const auto = flippable && mode === 'rotate';   // 自動で回すか（click はクリックだけ）
            box.classList.toggle('rotate', rotate);
            document.getElementById('aiSection').classList.toggle('click-flip', flippable && mode === 'click');
            document.getElementById('aiSection').classList.toggle('ai-rot', rotate);
            if (!rotate) box.classList.remove('flip');
            // 「クリックで反転」は、利用者が選んだ行（settings.flipped.ai）を出す。再起動や、行が一時的に 1 つに
            // なった（取得中など）あとでも戻す。自動で反転のときは回り続けるので保存しない。反転の動きの途中
            // （aiFlipBusy）は、動きが自分で行を入れ替えるので触らない。
            else if (mode === 'click' && !aiFlipBusy) box.classList.toggle('flip', !!settings.flipped.ai);
            const ms = aiRotateMs();
            if (auto && (!ai.rotateTimer || ai.rotateMs !== ms)) {
                // 間隔が変わったときは、作り直して新しい間隔にすぐ切り替える
                clearInterval(ai.rotateTimer);
                ai.rotateMs = ms;
                ai.rotateTimer = setInterval(function(){
                    // 見えていない間（フル表示で展開中）は回さない
                    if (box.offsetParent !== null) aiFlip();
                }, ms);
            } else if (!auto && ai.rotateTimer) {
                clearInterval(ai.rotateTimer);
                ai.rotateTimer = 0;
            }
        }
        // 行を入れ替える。折りたたみ（フル表示）では Wi-Fi 区画と同じく枠ごと横回転させ、
        // コンパクト表示は各行が枠を持つので、行の CSS 回転（.flip の切替）だけで足りる。
        let aiFlipBusy = false;
        function aiFlip(){
            const box = document.getElementById('ai-compact');
            const sec = document.getElementById('aiSection');
            if (aiFlipBusy) return;
            const frame = !document.getElementById('dragArea').classList.contains('compact')
                && sec.classList.contains('collapsed') && sec.classList.contains('ai-rot');
            if (!frame) { box.classList.toggle('flip'); return; }
            aiFlipBusy = true;
            sec.classList.add('ai-flip-out');
            setTimeout(function(){
                sec.classList.remove('ai-flip-out');
                sec.classList.add('ai-flip-snap');
                box.classList.toggle('flip');
                void sec.offsetWidth;   // -90° を確定させてから、0° への遷移を始める
                sec.classList.remove('ai-flip-snap');
                sec.classList.add('ai-flip-in');
                setTimeout(function(){ sec.classList.remove('ai-flip-in'); aiFlipBusy = false; }, 285);
            }, 285);
        }
        // クリックで反転（"click" のとき）。Wi-Fi と同じく区画のどこをクリックしても反転し、
        // ドラッグ後のクリックや、シェブロン・ボタン類のクリックは無視する。
        document.getElementById('aiSection').addEventListener('click', function(e){
            if (!this.classList.contains('click-flip') || movedSinceDown) return;
            const compact = document.getElementById('dragArea').classList.contains('compact');
            if (!compact && !this.classList.contains('collapsed')) return;
            if (e.target.closest('.chev, .ai-refresh, .ai-act, [data-ai-open], [data-ai-login]')) return;
            e.stopPropagation();
            if (aiFlipBusy) return;   // 動いている最中のクリックは無視する（面と保存値がずれないように）
            // 反転後の面を保存する（再起動しても同じ行から始める）。動きの途中ではクラスがまだ変わらないので、先に決める
            const next = !document.getElementById('ai-compact').classList.contains('flip');
            settings.flipped.ai = next;
            apiFetch('/api/setoption?key=flip.ai&value=' + next).catch(function(){});
            aiFlip();
        });
        // ログイン待ち・取得中は短い間隔で、安定したら長い間隔で見る（Go 側の取得は既定 5 分ごと）
        function aiNeedsFast(){
            const s = ai.settings, u = ai.usage;
            if (!s || !u) return true;
            return AI_PROVIDERS.some(function(p){
                return s[p.flag] && ['init', 'needs_login'].indexOf((u[p.id] || {}).authState || 'init') !== -1;
            });
        }
        async function aiFetchUsage(){
            if (!ai.settings || !ai.settings.enabled) return;
            try { const r = await apiFetch('/api/ai/usage'); if (r.ok) { ai.usage = await r.json(); renderAI(); } } catch (e) {}
        }
        async function aiFetchStatus(){
            if (!ai.settings || !ai.settings.enabled) return;
            try { const r = await apiFetch('/api/ai/status'); if (r.ok) { ai.status = await r.json(); renderAI(); } } catch (e) {}
        }
        function aiLoop(){
            clearTimeout(ai.timer);
            if (!ai.settings || !ai.settings.enabled) return;
            ai.timer = setTimeout(async function(){ await aiFetchUsage(); aiLoop(); }, aiNeedsFast() ? 3000 : 15000);
        }
        function aiStatusLoop(){
            clearTimeout(ai.statusTimer);
            if (!ai.settings || !ai.settings.enabled) return;
            const sec = Math.max(60, ai.settings.statusPollSeconds || 300);
            ai.statusTimer = setTimeout(async function(){ await aiFetchStatus(); aiStatusLoop(); }, sec * 1000);
        }
        function applyAISettings(){
            const s = ai.settings;
            if (!s) return;
            const on = !!s.enabled;
            document.getElementById('aiSection').classList.toggle('is-hidden', !on);
            if (!on) {

            } else {
                aiFetchUsage().then(aiLoop);
                aiFetchStatus().then(aiStatusLoop);
            }
            applyCollapsed();
            applyAICompactDisplay();
            scheduleHeightAdjust();
        }
        async function aiLoadSettings(){
            try { const r = await apiFetch('/api/ai/settings'); ai.settings = await r.json(); applyAISettings(); } catch (e) {}
        }
        function aiPost(path, obj){
            return apiFetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj || {}) });
        }
        // 区画内のボタン（ログイン、使用量・ステータスページを開く）
        document.getElementById('ai-body').addEventListener('click', function(e){
            const t = e.target.closest('[data-ai-login],[data-ai-open]');
            if (!t) return;
            e.stopPropagation();
            if (t.dataset.aiLogin) aiPost('/api/ai/relogin?provider=' + t.dataset.aiLogin).catch(function(){});
            else if (t.dataset.aiOpen) aiPost('/api/ai/open-' + t.dataset.aiOpen + '?provider=' + t.dataset.provider).catch(function(){});
        });
        // 見出しの「今すぐ更新」。取得が終わるまで回し、終わったら最新の値と障害状況を描き直す。
        document.getElementById('aiRefreshBtn').addEventListener('click', async function(e){
            e.stopPropagation();
            const btn = this;
            btn.classList.add('busy');
            try {
                const r = await aiPost('/api/ai/refresh');
                if (r.ok) { ai.usage = await r.json(); renderAI(); }
                aiFetchStatus();
            } catch (err) {}
            btn.classList.remove('busy');
        });
        // ============ 拡大・縮小 ============
        // ウィジェット全体の拡大率。実際の拡縮とウィンドウの大きさの変更は Go 側（zoom.go）が行い、
        // ここはキー・ホイール操作を受けて API を呼ぶ。操作は、ウィジェットにフォーカスがあるとき
        // （クリックして前面に出したあと）だけ届く。
        let zoomAfterTimers = [];
        function afterZoomChange(){
            // ウィンドウは Go 側で拡縮される。拡縮の完了後に、高さを測り直して位置を保存し、DPR が
            // 変わるのでグラフも描き直す（連続操作では最後の 1 回だけ走らせる）。
            zoomAfterTimers.forEach(clearTimeout);
            zoomAfterTimers = [
                setTimeout(adjustWindowHeight, 150),
                setTimeout(function(){ drawNetGraph(); redrawDiskGraph(); }, 200),
                setTimeout(function(){ apiFetch('/api/persistwindow').catch(function(){}); }, 450)
            ];
        }
        function setZoomPercent(p){
            if (p === settings.zoom) return;
            settings.zoom = p;   // 連打でも、次の段は手元の値から計算する
            apiFetch('/api/setoption?key=zoom&value=' + p).catch(function(){});
            afterZoomChange();
        }
        // 一覧の中で、いまの拡大率に最も近い段から dir（+1 拡大 / -1 縮小）だけ動かす。両端では動かない。
        function stepZoom(dir){
            const steps = settings.zoomSteps;
            let idx = 0;
            steps.forEach(function(s, i){ if (Math.abs(s - settings.zoom) < Math.abs(steps[idx] - settings.zoom)) idx = i; });
            idx = Math.max(0, Math.min(steps.length - 1, idx + dir));
            setZoomPercent(steps[idx]);
        }
        // Ctrl + プラス / マイナス / 0（元の大きさ）。テンキーも使える。JIS 配列では、プラスのキーが
        // Ctrl + ;（Shift なし。Edge / Chrome と同じ）で、Shift を押すと '+' になる。
        document.addEventListener('keydown', function(e){
            if (!e.ctrlKey || e.altKey || e.metaKey) return;
            if (e.key === '+' || e.key === '=' || e.key === ';' || e.code === 'NumpadAdd') { stepZoom(1); }
            else if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract') { stepZoom(-1); }
            else if (e.key === '0' || e.code === 'Numpad0') { setZoomPercent(100); }
            else return;
            e.preventDefault();
        });
        // Ctrl + ホイールで 1 段ずつ。連続で届くので間引く。
        let lastZoomWheel = 0;

            if (!e.ctrlKey) return;
            e.preventDefault();
            if (e.deltaY === 0) return;   // 横スクロールは縮小として扱わない
            const now = performance.now();
            if (now - lastZoomWheel < 120) return;
            lastZoomWheel = now;
            stepZoom(e.deltaY < 0 ? 1 : -1);
        }, { passive: false });

        // Go 側の永続設定を UI に反映する。起動時（initial）と、設定ウィンドウで変更されたとき
        // （window.__settingsChanged）に呼ぶ。
        // ウィンドウ位置・サイズ・透過・トレイ表示・前面表示は Go 側で既に復元済み。
        // ここでは UI 表示 (テーマ / Core 番号 / ボタン active 状態) だけを同期する。
        function applyServerSettings(s, initial){
            if (!s) return;
            const pmBefore = settings.powerMode;
            if (s.theme) settings.theme = s.theme;
            if (typeof s.transparent === 'boolean') settings.transparent = s.transparent;
            if (typeof s.powerMode === 'boolean') settings.powerMode = s.powerMode;
            if (typeof s.coreBase === 'number') settings.coreBase = s.coreBase;
            if (s.trayDisplay) settings.trayDisplay = s.trayDisplay;
            settings.skin = (typeof s.skin === 'string' && s.skin) ? s.skin : 'default';
            if (typeof s.topmost === 'boolean') settings.topmost = s.topmost;
            if (typeof s.viewMode === 'number') settings.viewMode = s.viewMode;
            if (s.netUnit) { settings.netUnit = s.netUnit; netUnit = s.netUnit; refreshNetLegend(); }
            if (s.diskIoView) { settings.diskIoView = s.diskIoView; applyDiskData(lastDisk); redrawDiskGraph(); }
            if (Array.isArray(s.zoomSteps) && s.zoomSteps.length) settings.zoomSteps = s.zoomSteps;
            if (typeof s.zoom === 'number') {
                const zoomChanged = settings.zoom !== s.zoom;
                settings.zoom = s.zoom;
                // 設定ウィンドウで変えられたとき。起動時（initial）は Go 側が表示前に適用済み
                if (zoomChanged && !initial) afterZoomChange();
            }
            if (Array.isArray(s.order) && s.order.length) settings.order = s.order;

            applyOrder();
            if (s.collapsed) Object.assign(settings.collapsed, s.collapsed);
            // いま出している面は、起動時だけ保存値から読む。変えるのはこのウィンドウのクリックだけなので、
            // 設定ウィンドウの変更で再取得されたときは、保存が間に合っていない古い値で上書きしない。
            if (initial && s.flipped) { Object.assign(settings.flipped, s.flipped); applyFlipped(true); applyAICompactDisplay(); }
            // CPU 名は起動後に変わらないので、ここで一度だけ反映する
            if (s.cpuName) setModelName('cpu-model', s.cpuName);

            applyTheme();
            applyCoreBase();
            document.getElementById('pinBtn').classList.toggle('active', !!settings.topmost);
            // 電源モードの切替機能の ON/OFF が変わったら、スライダーの表示を即座に合わせる
            // （OFF のときは先に隠し、ON のときは現在の状態を取得し直す）
            if (!initial && pmBefore !== settings.powerMode) {
                if (!settings.powerMode) updatePowerMode(null);
                updateData();
            }
            if (initial && settings.viewMode === 1) {
                currentViewMode = 1;
                document.getElementById('dragArea').classList.add('compact');
                // 保存された幅がフル表示のもの (旧バージョンの config など) でも
                // コンパクト幅に揃うよう、起動時にも Go 側の幅適用を呼ぶ。
                // 同じモードの再適用なので NormalWidth は退避し直されない。
                apiFetch('/api/setviewmode?mode=1')
                    .then(()=>{ setTimeout(adjustWindowHeight, 60); })
                    .catch(()=>{});
            }
            applyCompactBtn();
            applyCollapsed();
            // 勤務時間の設定（補正・昼休み・表示）や表示/非表示が変わったときだけ、次の周期を待たずに描き直す。
            // 無関係な設定変更で呼ぶと、Network / Disk のグラフ履歴に同じサンプルが二重に積まれる。
            if (s.workTimer) {
                const t = s.workTimer;
                const key = [settings.hidden.work, t.targetMinutes, t.lunchStart, t.lunchEnd, t.redAfter, t.showFloor, t.startLagMinutes].join('|');
                const workChanged = key !== workSettingsKey;
                workSettingsKey = key;
                if (!initial && workChanged) updateData().then(scheduleHeightAdjust);
            }
            if (s.pomodoro) {
                const t = s.pomodoro;
                const key = [settings.hidden.pomodoro, t.focusMinutes, t.shortBreakMinutes, t.longBreakMinutes, t.longEvery, t.autoNext, t.focusMode].join('|');
                const pomoChanged = key !== pomoSettingsKey;
                pomoSettingsKey = key;
                if (!initial && pomoChanged) updateData().then(scheduleHeightAdjust);
            }
            scheduleHeightAdjust();
            // 区画の表示/非表示・並び順が変わると高さが変わるので、落ち着いてから位置とサイズを保存する
            if (!initial) setTimeout(function(){ apiFetch('/api/persistwindow').catch(function(){}); }, 300);
            aiLoadSettings();
            // スキンは設定の再取得のたびに、同じ id でも CSS を取り直す（skin.css の編集を反映するため）。
